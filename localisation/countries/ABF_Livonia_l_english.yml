######## LVA Events ####### [[[
  abf_lva_event.1.t: "Role of Visby City"
  abf_lva_event.1.d: "We have come under control of the perfidious den of pirates: Visby City. A hub of trade and an operational nexus for Nordic pirates, it is now our duty to harness its potential for the glory of our nation. Our court has presented us with two options: Transform this cesspool into a thriving center of commerce or build it up into a formidable naval stronghold and integral hub of naval operations. The choice now lies before [Root.Monarch.GetTitle], determining the future of our role in the Baltic Sea..."
  abf_lva_event.1.a: "Turn these mauraders into merchants!"
  abf_lva_event.1.b: "The Norse will crumble before our newfound naval might!"
  abf_lva_event.2.t: "Rise of Krievzeme"
  abf_lva_event.2.d: "Now controlling all of Rus', a new identity has begun to emerge between the migrating Baltic peoples and their rapidly assimilating Slavic counterparts. This cultural synthesis has resulted in the rise of Krievzeme, a unique fusion of Baltic and Slavic traditions, as well as the rightful heirs of the Ruthenian legacy in our own way. Balts inhabitated these rich and fertile lands, for generations before the Slavs had arrived, and it is only right they return now to reclaim their ancestral heritage, and push the region forward into the future."
  abf_lva_event.2.a: "The tragedy of the Slavic invasion has been avenged!"
################################## ]]]

