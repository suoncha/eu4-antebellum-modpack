  estate_jains_abf_tcr_tamil_trade_guilds: "Support Tamil Trade Guilds"
  estate_jains_abf_tcr_tamil_trade_guilds_desc: "The Tamil people of Southern India have a long and storied history due to their integral role in the Indian Ocean trade. By directly supporting their industrious and mercantile guilds, we can further our economic control over the region and become the dominant economic power of Southern Asia."
