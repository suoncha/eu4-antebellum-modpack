######## TCR Government Reforms ####### [[[
  #--------Shared Path----------#
  abf_tcr_syncretic_bureacracy_reform: "Syncretic Bureaucracy"
  abf_tcr_syncretic_bureacracy_reform_desc: "Whether it be our Hellenistic, Kushan, or Yuezhi past, we have always adopted certain modes and forms of governance, martial strategies, and cultural trappings of our former overlords or per-emiment regional powers. This has resulted in the formation of a syncretic bureaucracy, in which we've adapted the most efficient and well-developed bureaucratic characteristics of past empires, to the ever-growing needs of our rising state."
  unlock_abf_tcr_syncretic_bureacracy_reform_tt: "§GUnlocks§! the §YSyncretic Bureaucracy§! §MTier 3§! Government Reform, giving the following effects:\n\nManpower in Accepted Culture Provinces: §G+15.0%§!\nMonthly Reform Progress Modifier: §G+10.0%§!\nMininium Autonomy in Territories: §G-5.0%§!"
  abf_tcr_one_faith_reform: "New Faith for a New Empire"
  abf_tcr_one_faith_reform_desc: "While our realm has come under the influence of myriad faiths in the past, it is time to cement our chosen faith as the one true faith of the State and the divine source of our Monarch's power. Unity of the faith will bring harmony and tranquility to both adminstration and daily life in our realm, and help bring our diverse array of subjects into the fold of our authority under the auspices of the a united religious doctrine."
  unlock_abf_tcr_one_faith_reform_tt: "§GUnlocks§! the §YNew Faith for a New Empire§! §MTier 5§! Government Reform, giving the following effects:\n\nMissionaries: §G+1§!\nMissionary Maintenance Cost: §G-10.0%§!\nMissionary Strength: §G+2.0%§!\nHarminization Speed: §G+25.0%§!\n\nThis reform includes the following Government Mechanics:\nEnables the §YDivine§! Idea Group\nConstructing Churches and Cathedrals increases §YClergy§! loyalty by §G2.0%§! and §G5.0%§! respectively\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  abf_tcr_all_religious_tolerance_reform: "Mandala of the Faiths"
  abf_tcr_all_religious_tolerance_reform_desc: "The religious makeup of our empire can be reflected in the meaning and structure of the Dharmic Mandala. A complex and intricate design that may be difficult to make sense of upon its first viewing, but that gives way to an understanding and acceptance of the very nature of reality upon continued analysis. Just as life is a difficult maze to navigate ultimately washed away upon death, so would any attempt to control and assert authority over religious life in our diverse state. Let the people follow their various faiths, and allow them to interpret this acceptance and understanding of their different beliefs as a gift and privilege, one that births the sympathetic and empthatic society which will rally under this syncretic approach as a universal right in our growing empire."
  unlock_abf_tcr_all_religious_tolerance_reform_tt: "§GUnlocks§! the §YMandala of Faiths§! §MTier 5§! Government Reform, giving the following effects:\n\nTolerance of Heretics: §G+3§!\nTolerance of Heathens: §G+3§!\nReligious Unity: §G+25.0%§!\n\nThis reform includes the following Government Mechanics:\nTemples and Cathedrals give the provinces §G+33.0%§! Local Tax Modifier and §G-2.00§! Local Unrest\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  abf_tcr_one_faith_buffed_reform: "New Faith for a New Empire"
  abf_tcr_one_faith_buffed_reform_desc: "While our realm has come under the influence of myriad faiths in the past, it is time to cement our chosen faith as the one true faith of the State and the divine source of our Monarch's power. Unity of the faith will bring harmony and tranquility to both adminstration and daily life in our realm, and help bring our diverse array of subjects into the fold of our authority under the auspices of the a united religious doctrine."
  unlock_abf_tcr_one_faith_buffed_reform_tt: "§GUpgrades§! the §YNew Faith for a New Empire§! §MTier 5§! Government Reform, giving the following effects:\n\nMissionaries: §G+1§!\nWarscore Cost Against Other Religions: §G-15.0%§!\nMissionary Strength: §G+3.0%§!\nHarminization Speed: §G+30.0%§!\n\nThis reform includes the following Government Mechanics:\nEnables the §YDivine§! Idea Group\nConstructing Churches and Cathedrals increases §YClergy§! loyalty by §G2.0%§! and §G5.0%§! respectively\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  abf_tcr_all_religious_tolerance_buffed_reform: "Mandala of the Faiths"
  abf_tcr_all_religious_tolerance_buffed_reform_desc: "The religious makeup of our empire can be reflected in the meaning and structure of the Dharmic Mandala. A complex and intricate design that may be difficult to make sense of upon its first viewing, but that gives way to an understanding and acceptance of the very nature of reality upon continued analysis. Just as life is a difficult maze to navigate ultimately washed away upon death, so would any attempt to control and assert authority over religious life in our diverse state. Let the people follow their various faiths, and allow them to interpret this acceptance and understanding of their different beliefs as a gift and privilege, one that births the sympathetic and empthatic society which will rally under this syncretic approach as a universal right in our growing empire."
  unlock_abf_tcr_all_religious_tolerance_buffed_reform_tt: "§GUpgrades§! the §YMandala of Faiths§! §MTier 5§! Government Reform, giving the following effects:\n\nNational Unrest: §G-1§!\nTolerance of Heretics: §G+3§!\nTolerance of Heathens: §G+3§!\n§YHeretic§! and §YHeathen§! provinces §Gno longer§! grant any §Rmaluses§!\n\nThis reform includes the following Government Mechanics:\nTemples and Cathedrals give the provinces §G+33.0%§! Local Tax Modifier and §G-2.00§! Local Unrest\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
