  kus1_fourth_desc: "Euro-Asiatic Trade is heavily centred on the Silk Road, which spans the length of Anatolia to China. Much to our good fortune, all routes lead through Kushan territory, meaning that merchants must pay tolls to travel both ways. Should we increase policing of these trade networks, and establish toll booths near oases and cities, we can dominate the flow of commerce between East and West!"
