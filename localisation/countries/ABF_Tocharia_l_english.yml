  ABF_tcr_event.8.t: "Matters of Faith"
  ABF_tcr_event.8.d: "As we have continued our push into India, we find ourselves having grown much more diverse in the process. We now rule over Hindus, Muslims, Jains, Zoroastrians, and a myriad of other faiths. This presents both challenges and opportunities as we seek to unify our realm under a single banner, but the question remains: how do we approach this subject? Should we promote a policy of religious of tolerance and coexistence, or enforce our faith placing religious laws and customs at the center of our society?"
  ABF_tcr_event.8.a: "§GThe Confederation is a home for all§!!"
  ABF_tcr_event.8.b: "§RHeretics and Heathens deserve no pity...§!"
