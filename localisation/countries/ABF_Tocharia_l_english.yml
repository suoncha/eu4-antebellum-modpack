  ABF_tcr_event.1.t: "Nexus of Two Worlds"
  ABF_tcr_event.1.d: "Our land lies at the crossroads of two great civilizations, the East and the West. For centuries, we have been a melting pot of cultures, religions, and ideas. Our people have embraced the best of both worlds, creating a unique and vibrant society that is unlike anything seen before. We have adopted elements of both Eastern and Western cultures, blending them together in a way that is uniquely Tocharian. This fusion has led to a new era of prosperity and enlightenment for our nation, but we are left with the question, which world do we want to be a part of?"
  ABF_tcr_event.1.a: "We shall revive the legacy of the §JKushan§! Empire!"
  ABF_tcr_event.1.b: "We shall claim the glory of the §GPersian§! Empire!"
  ABF_tcr_event.1.c: "Under our guidance, a new §YChinese§! Dynasty is born!"
  ABF_tcr_event.2.t: "The Question of Faith"
  ABF_tcr_event.2.d: "Having chosen our path, we now must fully embrace it. Some in our court suggest that we should fully adopt the customs and traditions of our chosen world, while others believe that we should maintain our unique Tocharian identity. This is a difficult decision, but we must choose wisely. Our future as a nation depends on it."
  ABF_tcr_event.2.a: "We are happy with our current faith!"
  ABF_tcr_event.2.b: "Let us embrace the ways of §VMahayana§! Buddhism"
  ABF_tcr_event.2.c: "Let us embrace the ways of §OTheravada§! Buddhism"
  ABF_tcr_event.2.e: "More Options"
