  #--------India Path----------#
  ABF_tcr_kushan_confederacy: "Kushan Confederacy"
  ABF_tcr_kushan_confederacy_desc: "The Kushan Confederacy represents a significant shift in governance, harkening back to the roots and foundations of the old Kushan Empire. Combining aspects of Greek, Indian, and Chinese governance, the Kushan Confederacy managed to adminster a vast and diverse empire unlike any other seen in history. By adopting this reform, we aim to streamline our bureaucratic processes, enhance our ability to manage diverse populations, and strengthen our overall state capacity. This change is expected to foster greater unity and stability within our realm, allowing us to better navigate the complexities of ruling a vast and culturally rich empire."
  unlock_ABF_tcr_kushan_confederacy_tt: "§GUnlocks§! the §YKushan Confederacy§! §MTier 1§! Government Reform, giving the following effects:\n\nYearly Legitimacy: §G+0.5§!\nGoverning Capacity Modifier: §G+10.0%§!\nStates Governing Cost: §G-10.0%§!\nMax Absolutism: §R-20§!\n\nThis reform also includes the following Government Mechanic:\nCan §YAssimilate§! Cultures into Adminstration\nAllows §YHeathen§! Royal Marriages\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  abf_kushan_syncretic_adminstration_reform: "Kushan Syncreticism"
  abf_kushan_syncretic_adminstration_reform_desc: "The Kushan Confederacy managed to forge a syncretic blend of adminstrative tools and functions out of a seemly divided and disparate state, spanning across a diverse array of cultural and religious divides. But through meritocratic appointments and selective borrowing, we have forged an adminstrative cadre that can bridge these stark differences between our people, and create a functioning government out of nothing."
  unlock_abf_kushan_syncretic_adminstration_reform_tt: "§GUpgrades§! the §YSyncretic Bureaucracy§! §MTier 3§! Government Reform, replacing its effects with the following:\n\nMonarch Diplomatic Skill: §G+1§!\nYears of Separatism: §G-5§!\nManpower in Accepted Culture Provinces: §G+15.0%§!\nMonthly Reform Progress Modifier: §G+10.0%§!\n\nThis reform also includes the following Government Mechanics:\n§GUnlocks§! access to use and upgrade all §YIndian§! Great Projects"
  abf_tcr_kushan_maratha_confederacy_reform: "Maratha Confederacy"
  abf_tcr_kushan_maratha_confederacy_reform_desc: "The Marathi were some the most resistant people in our attempts to restore Kushan authority over the Indian subcontinent, yet we have come to a mutual agreement with them when comes to autonomy and representation. Utilizing their martial prowess and skilled bureaucratic class, we have managed to form a new adminstration that can ease the troubles of adminstering such a diverse land, and cement our authority over these lands via cooperation with these people."
  unlock_abf_tcr_kushan_maratha_confederacy_reform_tt: "§GUnlocks§! the §YMaratha Confederacy§! §MTier 6§! Government Reform, giving the following effects:\n\nMonarch Military Skill: §G+1§!\nReinforce speed: §G+25.0%§!\nMarathas Max Privileges: §G+1§!\n\nThis reform also includes the following Government Mechanic:\nSeizing land does not provoke §YMaratha§! rebels"
  abf_tcr_kushan_right_conquest_reform: "Right of Conquest"
  abf_tcr_kushan_right_conquest_reform_desc: "We have legitimized our rule by many means, but the only one that truly matters is that of conquest. We have asserted our right to rule over this vast and diverse empire through fire and sword alone, and all those who seek to contest our authority my test their metal on the battlefield against our forces, for we have come this far, and we do not plan on stopping now!"
  unlock_abf_tcr_kushan_right_conquest_reform_tt: "§GUnlocks§! the §YRight of Conquest§! §MTier 9§! Government Reform, giving the following effects:\n\nFree Military Policies: §G+1.0§!\nProvince Warscore Cost: §G-15.0%§!\nGoverning Capacity Modifier: §G+10.0%§!\nMax Absolutism Effect: §G+10.0%§!\n\nThis reform also includes the following Government Mechanics:\nGains §YManpower§! from Defeating Enemy Armies."
  abf_tcr_kushan_aryan_spirit_reform: "Aryan Spirit"
  abf_tcr_kushan_aryan_spirit_reform_desc: "The Aryan spirit, characterized by courage, honor, and a commitment to excellence, has long been a defining feature of our empire. We must continue to cultivate and promote these values among our people, fostering a sense of pride and unity that will inspire them to achieve greatness in all aspects of life. This includes encouraging the pursuit of knowledge, artistic expression, and military prowess, as well as promoting a culture of civic responsibility and ethical conduct. By embracing the Aryan spirit, we can ensure that our empire remains a beacon of strength, wisdom, and virtue for generations to come."
  unlock_abf_tcr_kushan_aryan_spirit_reform_tt: "§GUnlocks§! the §YAryan Spirit§! §MTier 11§! Government Reform, giving the following effects:\n\nGoverning Capacity Modifier: §G+10.0%§!\nAdminstrative Efficiency: §G+5.0%§!\nTechnology Cost: §G-5.0%§!\nLand Morale: §G+10.0%§!\n\nThis reform also includes the following Government Mechanic:\nWinning battles on our territory grants §G0.1§! bonus Army Tradition\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  #------------------#
  #--------Persian Path----------#
  ABF_tcr_persianempire: "Greco-Persianate Empire"
  ABF_tcr_persianempire_desc: "With our shift toward the West, we have revived the ancient traditions of the Persian Empire and invoked the trappings of its Hellenic dynasties. By adopting the administrative practices and cultural norms of the Persians and Greeks, we aim to create a more efficient and unified state that can better manage our diverse populations and territories. This change is expected to strengthen our overall state capacity, foster greater unity and stability within our realm, and allow us to better navigate the complexities of ruling a vast and culturally rich empire."
  unlock_ABF_tcr_persianempire_tt: "§GUnlocks§! the §YGreco-Persianate Empire§! §MTier 1§! Government Reform, giving the following effects:\n\nYearly Legitimacy: §G+0.5§!\nGoverning Capacity Modifier: §G+10.0%§!\nProvince Warscore Cost: §G-10.0%§!\n\nThis reform also includes the following Government Mechanic:\nCan §Yassimilate§! cultures into adminstration\nHas access to §YSatrapy§! subjects\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  abf_tcr_persia_turkic_legacy_reform: "Turco-Iranian Bureaucracy"
  abf_tcr_persia_turkic_legacy_reform_desc: "While the Turkic hordes and their successors managed to shatter the mighty empires of our ancestors and oppress our people for centuries, we have come to terms with their permanence in the region, and even worked to integrate them seamlessly into our society. We both have long histories and a mutual respect for martial tradition, literature, and the arts. In fact, during the Mongol rule the intellectual and political culture and practices of the Turks heavily borrowed and selectively adapted ancient and modern trappings of Persian governance and thought. Today we continue this syncretic blend, merging our unique bureaucracies into one united adminstrative network"
  unlock_abf_tcr_persia_turkic_legacy_reform_tt: "§GUnlocks§! the §YTurco-Iranian Bureaucracy§! §MTier 6§! Government Reform, giving the following effects:\n\nState Governing Cost: §G-15.0%§!\nUnjustified Demands: §G-10.0%§!\nMax Absolutism: §G+5.0§!\nCavalry Combat Ability: §G+10.0%§!\n\nThis reform also includes the following Government Mechanic:\nCan place §YPashas§!\n§YPashas§! now grant an additional §G+20.0%§! Local Tax Modifier for provinces of foreign culture groups."
  abf_tcr_per_macedonian_heritage_reform: "Macedonian Legacy"
  abf_tcr_per_macedonian_heritage_reform_desc: "We have claimed the legacy of Alexander the Great, and the glorious and expansive empire of Macedon. It's martial spirit courses through our veins, and now our leaders look toward the past to continue our success by emulating the success of ancestor's campaigns and adminstrations."
  unlock_abf_tcr_per_macedonian_heritage_reform_tt: "§GUnlocks§! the §YMacedonian Legacy§! §MTier 9§! Government Reform, giving the following effects:\n\nGoverning Capacity Modifier: §G+10.0%§!\nMonarch Military Power: §G+1§!\nFree Military Policies: §G+1§!\nMax Absolutism: §G+10.0§!"
  abf_tcr_per_divine_authority_reform: "Divine Authority"
  abf_tcr_per_divine_authority_reform_desc: "Our authority has been legitimized by the chosen prophets and gods of state's religion. Through this divine right, we wield unquestionable and absolute power over the realm and our subjects, and will use this position to further our centralization of power and ability to rapidly mobilize in times of war. For belief in the faith, translates into submission to the Monarch's will."
  unlock_abf_tcr_per_divine_authority_reform_tt: "§GUnlocks§! the §YDivine Authority§! §MTier 7§! Government Reform, giving the following effects:\n\nGoverning Capacity: §G+150§!\nWarscore Cost Against Other Religions: §G-10.0%§!\nManpower in Provinces of the True Faith: §G+15.0%§!\n\nThis reform includes the following Government Mechanics:\n\nReligious Diplomats has no impact on Influence or Absolutism while being Defender of Faith\nBeing Defender of Faith gives the following effects:\nTolerance of True Faith: §G+2.00§!\nDiplomatic Reputation: §G+1.00§!\nImprove Relations: §G+15.0%§!"
  abf_tcr_per_greco_iranian_spirit_reform: "Greco-Iranian Spirit"
  abf_tcr_per_greco_iranian_spirit_reform_desc: "Our Bactrian heritage was founded upon the mixture of Hellenistic and Iranian civilizations. Fusing together their cultural trappings and norms, along with their shared martial tradition, the spirit of both these empires runs through our veins, and has guided the minds of our generals, drive of our bureaucrats, and fervor of our preachers in our efforts to forge a new empire that will stand the test of time. This Greco-Iranian Spirit has turned into a sort of national identity for our people, one they proudly wear throughout their day to day happenings, and call upon for strength in the hardest of moments."
  unlock_abf_tcr_per_greco_iranian_spirit_reform_tt: "§GUnlocks§! the §YGreco-Iranian Spirit§! §MTier 11§! Government Reform, giving the following effects:\n\nGoverning Capacity Modifier: §G+10.0%§!\nAdminstrative Efficiency: §G+5.0%§!\nIdea Cost: §G-5.0%§!\nMilitary Tactics: §G+0.10§!\n\nThis reform also includes the following Government Mechanic:\nWinning battles on our territory grants §G0.1§! bonus Army Tradition\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  #------------------#
  #--------Chinese Path----------#
  ABF_tcr_yuezhi_warlord: "Yuezhi Warlord State"
  ABF_tcr_yuezhi_warlord_desc: "While we are unable to claim the Mandate of Heaven for ourselves yet, we find ourselves in a percuilar situation. As the descendants of the ancient Yuezhi people, we have a unique claim to the lands of China, yet we are just another warlord in the race for the throne. This reform represents our attempt to embrace our Yuezhi heritage while still navigating the complex political landscape of China. By adopting this reform, we aim to streamline our bureaucratic processes, enhance our ability to manage diverse populations, and strengthen our overall state capacity. This change is expected to foster greater unity and stability within our realm, allowing us to better navigate the complexities of ruling a vast and culturally rich empire."
  unlock_ABF_tcr_yuezhi_warlord_tt: "§GUnlocks§! the §YYuezhi Warlord State§! §MTier 1§! Government Reform, giving the following effects:\n\nYearly Legitimacy: §G+0.5§!\nGoverning Capacity Modifier: §G+10.0%§!\nProvince Warscore Cost: §G-15.0%§!\n\nThis reform also includes the following Government Mechanic:\nHas access to the '§YUnification of China§!' casus belli\nEvery owned or conquered province in the §YChinese§! culture group that folllows the §Y[Root.Religion.GetName]§! faith or any §YHarmonized§! religion will have their §Runaccepted§! culture modifiers §Gnegated§!\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  ABF_tcr_celestial_empire: "Sino-Yuezhi Celestial Empire"
  ABF_tcr_celestial_empire_desc: "Having rejected the Mandate of Heaven but still proclaiming ourselves the sole rulers of China, we find ourselves in a unique position. We have combined the ways of the Yuezhi with the traditions of the Chinese, creating a new form of governance that reflects our dual heritage. By adopting this reform, we aim to streamline our bureaucratic processes, enhance our ability to manage diverse populations, and strengthen our overall state capacity. This change is expected to foster greater unity and stability within our realm, allowing us to better navigate the complexities of ruling a vast and culturally rich empire."
  unlock_ABF_tcr_celestial_empire_tt: "§GUnlocks§! the §YSino-Yuezhi Celestial Empire§! §MTier 1§! Government Reform, giving the following effects:\n\nAdminstrative Efficiency: §G+2.5%§!\nGoverning Capacity: §G+500§!\nMax Absolutism: §G+15§!\nDiscpline: §G+5.0%§!\n\nThis reform also includes the following Government Mechanic:\nHas §YMeritocracy§!\nCan §YClaim§! Entire States\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  abf_tcr_ordu_reform: "Sino-Yuezhi Ordu"
  abf_tcr_ordu_reform_desc: "Every high ranking Khitan noble has a personal retinue of servants and bodyguards, called the Ordu. These soldiers of the ordu are some of the most well trained and equipped of our people, being expert horsemen: With the Khitans under the heel, it would be wise to integrate these elite noblemen into our bureaucracy and military, ensuring a strong and elite class of warriors will always be at the ready."
  unlock_abf_tcr_ordu_reform_tt: "§GUnlocks§! the §YSino-Yuezhi Ordu§! §MTier 2§! Government Reform, giving the following effects:\n\nLand Leader Shock: §G+2§!\nShock Damage: §G+5.0%§!\nYearly Army Tradition: §G+0.25§!\n\nThis reform also includes the following Government Mechanic:\nRecruting Generals now grants §G+2.50%§! Nobility loyalty"
  abf_tcr_sino_yuezhi_spirit_reform: "Sino-Yuezhi Spirit"
  abf_tcr_sino_yuezhi_spirit_reform_desc: "The ancient history and traditions of the Yuezhi people has melded overtime with the vibrant and unyielding culture and norms of Chinese civilization. Our claim to the Dragon Throne and the Mandate of Heaven that comes along with it have been secured, eased by the rapid assimilation of our people into Chinese society and the Dynastic system. But just as the Chinese have shaped and molded our new found way of life, the Yuezhi have had the same effect on the Chinese, creating a new culture with mixed Sino-Iranian features, bringing together the best facets of both civilizations. The rise of a new national and cultural identity has bridged the divide between our people, birthing the Sino-Yuezhi Spirit."
  unlock_abf_tcr_sino_yuezhi_spirit_reform_tt: "§GUnlocks§! the §YSino-Yuezhi Spirit§! §MTier 11§! Government Reform, giving the following effects:\n\nDiscipline: §G+5.0%§!\nYears of Separatism: §G-5.0§!\nAdminstrative Efficiency: §G+2.5%§!\nMax Absolutism: §G+15.0§!\n\nThis reform also includes the following Government Mechanic:\nWinning battles on our territory grants §G0.1§! bonus Army Tradition\n\n§R(This is a locked Government Reform. You will not be able to revoke it once enacted)§!"
  abf_tcr_china_eight_banners_reform: "Yuezhi Eight Banners"
  abf_tcr_china_eight_banners_reform_desc: "The Eight Banners are a military and administrative division of our state. Although primarily serving as armies to our realm, the banner system provides a point of reference for other institutions throughout our country, instilling a martial spirit and state of continious military prepardness."
  unlock_abf_tcr_china_eight_banners_reform_tt: "§GUnlocks§! the §YYuezhi Eight Banners§! §MTier 4§! Government Reform, giving the following effects:\n\nArmy Tradition Decay: §G-5.0%§!\nMorale Damage Received: §G-5.0%§!\nCountry Allows §YBanners§!\nAllowed Banner Force Limit Fraction: §G+25.0%§!\n\nThis reform incldues the following Government Mechanics:\n§YBanners§! gain §G33.0%§! Reinforce Speed and §G-10.0%§! Attrition\nThe Corruption §Rmalus§! from raising §YBanners§! is now §Ghalved§!"
