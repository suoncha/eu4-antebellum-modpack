  #----Events----#
  abf_tcr_yuezhi_crisis.1.t: "The Yuezhi Crisis"
  abf_tcr_yuezhi_crisis.1.d: "Ever since our incursions into Mongolia, we have come into increasing contact with the Emperor of China and the various Warlord claimant states that border the region. If we are to pursue our destiny and take our rightful place within the Dynastic cycle, our Generals and Tribal Chieftians have formulated a daring plan to disrupt these states and throw them into disarray, leaving the interior of China wide open for future conquest. As our troops amass at the border, and our nomadic allies infilitrate and sabotage the vast network of defenses set up over the centuries, we have begun to draw the attention of the various dynasties. Our goal is capture Beijing, or Yanjing in our tounge, claiming the divine Mandate of Heaven that is held within and embodied by the ancient Forbidden City. Already striking fear into the hearts and minds of the feeble levies set up to guard this pourous border, we await our courtier's return from Beijing with word of their surrender, or the clattering of swords and distinct stomp of heavily armored troops towards our positions..."
  abf_tcr_yuezhi_crisis.1.c: "We wait for their 'Celestial' response..."
  abf_tcr_yuezhi_crisis.2.t: "Yuezhi at the Gates"
  abf_tcr_yuezhi_crisis.2.d: "For weeks now, we have watched as the growing Yuezhi state has begun to gather massive armies on our Northern frontier, clearly primed for well-planned and highly coordinated incursion deep into our heartland. A courtier has arrived with a list of demands and conditions of 'bloodless' territorial exchange, but could this show simply be a farce? Many in our court are alarmed by these developments, and are urging us to accept their demands so that we may regroup and properly prepare for conflict, while others demand that we meet them on the battlefield. The question is, what shall our choice be?"
  abf_tcr_yuezhi_crisis.2.a: "We have no choice but to surrender..."
  abf_tcr_yuezhi_crisis.2.b: "To hell with the Nomads! War it is!"
  abf_tcr_yuezhi_crisis.3.t: "Terms of Surrender Met"
  abf_tcr_yuezhi_crisis.3.d: "The false claimants have surrendered due to the overwhelming force they faced by our strategically and tacitcally superior forces. We know stand at the Gates of the Forbidden City, the key to the Celestial gate that will crown us with the Mandate of Heaven. The gateway to the interior of China is now open, and its fertile and resource rich lands are now ripe for the taking..."
  abf_tcr_yuezhi_crisis.3.a: "A new Dynasty has taken its seat on the Dragon Throne."
  abf_tcr_yuezhi_crisis.4.t: "Chinese Hegemons Prepare for War"
  abf_tcr_yuezhi_crisis.4.d: "The current Chinese Hegemon has rejected our merciful offer to spare their lands from the death and destruction that is to soon be wrought upon them. It is now time for action, and our generals have ordered our troops to march fourth and claim what is rightful ours!"
  abf_tcr_yuezhi_crisis.4.a: "Forward, to the Imperial City!"
  abf_tcr_yuezhi_crisis.5.t: "Yuezhi Claim Hegemony over China"
  abf_tcr_yuezhi_crisis.5.d: "We have done it. We have overcome the once mighty Emperor of China and taken the Forbidden City for our own, our banners flying high over its great red walls. The [Root.Monarch.GetName] takes their seat now upon the Dragon Throne, with the entire North of China, in addition to Mongolia and Manchuria, now under our heel. For it is the dawn of a new age, the age of the Yuezhi."
  abf_tcr_yuezhi_crisis.5.a: "Guishuang rise once again"
  abf_tcr_yuezhi_crisis.6.t: "Yuezhi Shattered"
  abf_tcr_yuezhi_crisis.6.d: "We have shattered the Yuezhi menance, scattering their armies and slaughtering their military leadership. Without a proper martial force to maintain order and enforce their central authority, their lands have now come under our suzerainty, expanding our empire ever further West. The Silk Road and its gateways for our luxury goods Westward now lie firmly under our control."
  abf_tcr_yuezhi_crisis.6.a: "The Nomads have been repelled once more!"
  abf_tcr_yuezhi_crisis.7.t: "The Treaty of [ABFYuezhiCrisisPeaceTreatyCity.GetName]"
  abf_tcr_yuezhi_crisis.7.d: "The Yuezhi Crisis has devastated both China proper and the hinterlands inhabitated by the Yuezhi themselves. Cities lie in ruins, rivers run slick with blood, and bodies pile high on the fields and steppes of Northern China. Neither combantant made any form of siginificant gains in these bloody affair, but both have exhausted their societies of all their resources, bringing them to their very breaking points, halting the conflict at its height. While a truce lies in place for now, the bloody feud formed between the two sides has been cemented for centuries to come, and conflict circles overhead, each side eying its opprotunity to rengage and seek retribution for the great losses suffered in this pyrrhic conflict."
  abf_tcr_yuezhi_crisis.7.a: "So much death, and for what... ?"
