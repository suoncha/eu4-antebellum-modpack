l_english:

######## TCR Missions ####### [[[
  #----Shared/Base Missions----#
  tcr_desert_training_title: "Desert Training"
  tcr_desert_training_desc: "Our armies must be prepared to fight in all environments, including the harsh deserts that make up much of our territory. We must put our army through rigorous training to ensure they can operate effectively in these conditions."
  tcr_zamburak_title: "Adopt the Zamburak"
  tcr_zamburak_desc: "The Zamburak is a type of mobile artillery mounted upon camels that has been used effectively in recent conflicts. We must adopt this technology to enhance our military capabilities and provide our armies with a tactical advantage on the battlefield that will allow us to crush foes with ease."
  tcr_nexus_title: "The Nexus of Two Worlds"
  tcr_nexus_desc: "Our empire sits at the crossroads of two great civilizations - the East and the West. This unique position allows us to draw upon the strengths of both cultures, blending their knowledge, technology, and traditions to create a powerful and prosperous society. We must continue to embrace this dual heritage, fostering trade, diplomacy, and cultural exchange between the two worlds to ensure our empire's continued growth and success. But the question is, which world will we ultimately align ourselves with?"
  tcr_religious_approach_title: "Fate of the Many Faiths"
  tcr_religious_approach_desc: "Our empire is home to a diverse array of religious beliefs and practices. We can navigate the complex landscape of faith and ensure that we respect the spiritual needs of all our subjects while promoting unity and stability within our realm, or enforce a single faith upon all our subjects, ensuring that our empire is united under a single spiritual banner. The choice is ours, and the consequences of our decision will shape the future of our empire for generations to come."
  tcr_silk_road_trading_cities_title: "Control the Trading Cities" 
  tcr_silk_road_trading_cities_desc: "The cities along the Silk Road are vital to our trade and economy. By exerting control over these key trading hubs, we can ensure the flow of goods and wealth into our empire. This requires a combination of military might, diplomatic finesse, and economic investment to secure our interests and expand our influence throughout the region."
  tcr_bureaucracy_title: "Bureaucracy Takes Form"
  tcr_bureaucracy_desc: "The administration of our empire is a complex and challenging task, and yet we have many examples we can pull from our past to help us determine the best way to govern our diverse and expansive realm. We must establish a system of bureaucracy that is efficient, transparent, and responsive to the needs of our citizens. This includes creating clear lines of authority, implementing effective record-keeping practices, and ensuring that our officials are held accountable for their actions. By building a strong and capable bureaucracy, we can ensure the stability and prosperity of our empire for generations to come."
  tcr_standing_army_title: "Formalize the Standing Army"
  tcr_standing_army_desc: "While we have managed to maintain a formidable military force, it is essential that we formalize our standing army to ensure its continued effectiveness and readiness. This includes establishing clear structures of command, implementing standardized training and equipment, and ensuring that our soldiers are well-compensated and motivated to serve. By formalizing our standing army, we can enhance our military capabilities, deter potential adversaries, and secure the safety and stability of our empire."
  #----------------------#

  #----Indian/Kushan Missions----#
  tcr_gateway_china_title: "Gateway to China"
  tcr_gateway_china_desc: "With the Tarmin Basin and the neighboring entrepots of the Silk Road now under our control, we can revive this vital passageway East, restoring it to its former glory and reaping the benefits of increased trade and influence. By investing in the infrastructure and security of this region, we can ensure that our empire remains a key player in the flow of goods, ideas, and culture between East and West."
  tcr_riches_indus_title: "Riches of the Indus"
  tcr_riches_indus_desc: "The Indus River Valley is the birthplace of Indo-Iranian civilization, being the point of origin for many new religions, cultures, technologies, and much more. But overtime, the Indus has been neglected and left to decay, with many of its cities falling into ruin due to centuries of foreign invasion and economic decline. We must invest in the restoration and development of the Indus River Valley, revitalizing its cities, infrastructure, and economy. By doing so, we can unlock the riches of this ancient land, ensuring that it once again becomes a thriving center of culture, trade, and innovation."
  tcr_babricum_title: "Great Port of Barbarikon"
  tcr_babricum_desc: "Barbarikon was once an essential port on the mouth of the Indus River, linking the Hellenic and Indian worlds. It linked the Indian Ocean to the Mediterranean via Read Sea and Persian Gulf ports, and was a vital hub for trade and commerce. We must invest in the restoration and development of Barbarikon, ensuring that it regains its status as a premier port and gateway to the riches of the East. By doing so, we can enhance our empire's economic prosperity and strengthen our position as a dominant force in regional trade."
  tcr_orissa_title: "Sunset over Orissa"
  tcr_orissa_desc: "The region of Orissa is a wild and untamed land, covered and dominated by dense forests and jungles. It's land split between civilized and uncivilized, leading to a highly indepedent and rebellious culture amgonst those that inhabit this region. As we continue our push to unify India under our rule, Orissa must fall as well, bringing the diverse people of these lands one step closer towards unity."
  tcr_pataliputra_title: "Restore Pataliputra"
  tcr_pataliputra_desc: "Another one of the great cities that hosted the capital of the Kushan Confederation, Pataliputra was a thriving center of culture, religion, and commerce along the Ganges river. Home to one of the greatest universities of the ancient world, it was a hub for scholars and intellectuals from across the region. We must invest in the restoration and revitalization of Pataliputra, ensuring that it regains its status as a premier city and center of learning, arts, and literature."
  tcr_accomodate_rajputs_title: "Accommodate the Rajputs" 
  tcr_accomodate_rajputs_desc: "The Rajputs maintain significant influence despite our conquest. While we could just take care of them the old fashioned way, it would be easier and more beneficial to recruit them into our army. The Rajputs will fight for Zun and spread our light all across India."
  tcr_ujjain_title: "Rebuild Ujjain"
  tcr_ujjain_desc: "Ujjain was once one of the holiest cities in all of India, and the former capital of a united Rajput kingdom. It was a vibrant center of culture and spawned many religious scholars, as well as serving as a regional capital for many empires throughout the centuries. The Rajputs have slowly warmed up to us over time, but rebuilding this great city of theirs would do wonders to cement our alliance with them."
  tcr_purusapura_title: "Restore Purushapura"
  tcr_purusapura_desc: "The ancient city of Purushapura, once a thriving center of culture and commerce, now lies in ruins. Situated in what was once the heart of our empire, it is our duty to restore its former glory and revitalize its economy. By investing in infrastructure, trade, and local governance, we can bring Purushapura back to life and ensure its place as a key player in our empire's future. For the dual capitals of the great Kushan Empire must rise again!"
  tcr_kapisa_title: "Rebuild Kapisa"
  tcr_kapisa_desc: "Kapisa used to be one of the crown jewels of the Kushan Empire. It was host to the Bagram Treasures, which was built up through its position as a key silk road trading hub, exchanging goods from Rome all the way to China, allowing us to amass great wealth. In addition to that, it served as a regional capital amd was even the favorite choice of Kanishka himself. It would do us well to rebuild this once might city, as a testament to our power."
  tcr_mathura_title: "Revive Mathura"
  tcr_mathura_desc: "Mathura, once a vibrant city known for its rich cultural heritage and bustling trade, but with the fall of our once mighty empire many ages ago, the city has been reduced to a shadow of its former self. We must invest in the revival of Mathura, restoring its infrastructure, promoting trade, and fostering cultural exchange. By doing so, we can ensure that Mathura once again becomes a thriving center of commerce and culture, contributing to the prosperity of our empire."
  tcr_gangetic_plain_title: "Thurst into the Gangetic Plain"
  tcr_gangetic_plain_desc: "With our hold over the Indus Valley secured, it is time to push further east into the fertile lands of the Gangetic Plain. This region, rich in resources and agricultural potential, has long been a coveted prize for empires throughout history. By expanding our territory into the Gangetic Plain, we can ensure a steady supply of food and resources for our growing population, while also establishing a strategic foothold in the heart of the Indian subcontinent."
  tcr_gujurat_title: "Control Gujarat"
  tcr_gujurat_desc: "Gujarat is Western cousin of the Bengal Delta when it comes to trade and commerce. Its strategic location along the Arabian Sea and Indian OCean has made it a vital hub for maritime trade, connecting the Indian subcontinent to the Middle East, Africa, and beyond. By establishing control over Gujarat, we can tap into its vast economic potential, fostering trade and commerce that will benefit our empire as a whole."
  tcr_rajputana_title: "Subjugate Rajputana"
  tcr_rajputana_desc: "The Rajputana region, home to the fierce and proud Rajput clans, has long resisted foreign rule. Their warrior culture and strong sense of independence make them a formidable foe. However, by subjugating Rajputana and bringing it under our control, we can harness the strength and valor of the Rajput warriors, integrating them into our military forces. This will not only bolster our army but also ensure the stability and security of our empire's Western borders."
  tcr_west_indian_ports_title: "West Indian Ports"
  tcr_west_indian_ports_desc: "The western coast of India is dotted with numerous ports that have long been centers of trade and commerce. These ports serve as vital gateways for the exchange of goods, ideas, and culture between the Indian subcontinent and the wider world. By investing and expanding the infrastructure of these ports, we can enhance our maritime capabilities, boost trade, and strengthen our empire's economic position as a whole. We must set fourth and put in the great effort to make these ports the envy of all other nations!"
  tcr_china_title: "The Tiger and the Dragon"
  tcr_china_desc: "Chinese and Indo-Aryan civilization have long been intertwined, with trade, diplomacy, and cultural exchange shaping the course of history for both regions. As we continue to expand our empire, we will invetiably come into contact with the great Chinese civilization. We must approach this relationship with caution and respect, recognizing the strengths and complexities of Chinese society while also asserting our own influence and interests or finally end this fearsome competition once and for all..."
  tcr_gunpowder_title: "Gunpowder Empire"
  tcr_gunpowder_desc: "The art of gunpowder warfare has revolutionized the way wars are fought. By embracing this new technology and integrating it into our military strategies, we have gained a significant advantage over our rivals. We must invest in the development and production of gunpowder weapons, training our soldiers in their use, and adapting our tactics to maximize their effectiveness on the battlefield. With gunpowder at our disposal, we can ensure that our empire remains a dominant force in the region for centuries to come!"
  tcr_tamils_title: "Tamil Trade Guilds"
  tcr_tamils_desc: "The Tamil people are known throughout Hindustan and further beyond across Indo-Aryan civilization for their skill in trade and commerce. Their expertise in navigating the complex networks of trade routes and their ability to establish successful trading ventures have made them invaluable partners in our economic endeavors. Not to mention their industrious nature and dedication to their craft, which has earned them a reputation for producing high-quality goods and services. These people are also renowned for their innovative thinking and martial prowess, with many of their native inventions and tactics by imported or adapted by some of the most advanced nations in the world. By fostering strong relationships with the Tamil people and supporting their trade guilds, we can further enhance our empire's economic prosperity and ensure that our influence extends across the Indian subcontinent and beyond."
  tcr_marathas_title: "The Maratha Confederacy"
  tcr_marathas_desc: "The Maratha people are some of, if not the most, tenacious warriors we've ever engaged in combat. Acting as both a socio-religious caste and informal confederacy of princely states, they have long resisted foreign rule and maintained their independence through a combination of military prowess, strategic alliances, and a deep sense of cultural identity. By forging alliances with the Maratha Confederacy and integrating their warriors into our military forces, we can harness their unique skills and knowledge of the local terrain to strengthen our empire's position in the region. This will not only bolster our army but also ensure the stability and security of our empire's borders."
  tcr_deccan_title: "Dominate the Deccan"
  tcr_deccan_desc: "The Deccan Plateau is a vast and resource-rich region that has long been a center of power and influence in the Indian subcontinent. Its strategic location and abundant resources make it a vital area for any empire seeking to establish dominance in the region. By expanding our control over the Deccan, we can tap into its economic potential, strengthen our military presence, and secure our empire's southern borders. We must launch a campaign to dominate the Deccan, bringing its peoples under our rule and integrating them into our empire."
  tcr_coromandel_title: "Control Coromandel"
  tcr_coromandel_desc: "The Coromandel Coast, stretching along the southeastern coast of India, is a vital region for trade and commerce. Its strategic location along the Bay of Bengal has made it a hub for maritime trade, connecting the Indian subcontinent to Southeast Asia and beyond. By establishing control over the Coromandel Coast, we can enhance our maritime capabilities, boost trade, and strengthen our empire's economic position as a whole."
  tcr_sri_lanka_title: "The Gem of Southern India"
  tcr_sri_lanka_desc: "Sri Lanka, the island nation located off the southern coast of India, is renowned for its rich natural resources, including precious gems, spices, and fertile lands. We must invest in this small island, in order to further tap into its abundant luxury resources and skilled craftsmen. By establishing a strong presence in Sri Lanka, we can enhance our empire's economic prosperity and secure a strategic foothold in the Indian Ocean region."
  tcr_golconda_title: "The Golconda Diamonds"
  tcr_golconda_desc: "The Golconda region is famous for its diamond mines, which have produced some of the most exquisite and valuable diamonds in the world. These precious gems have long been coveted by royalty and nobility, symbolizing wealth, power, and prestige. By controlling the Golconda diamond mines, we can tap into this lucrative trade, boosting our empire's economic prosperity and enhancing our status on the global stage. We must invest in the development and expansion of the Golconda diamond industry, ensuring that our empire remains a dominant force in the world of luxury goods."
  tcr_monastic_education_title: "Monastic Education"
  tcr_monastic_education_desc: "The monastic institutions within our empire have long been centers of learning and spiritual growth. By investing in the education and training of our monks, we can ensure that they are well-equipped to serve as spiritual leaders and educators for our people. This includes providing them with access to the latest knowledge and teachings, as well as fostering a culture of intellectual curiosity and critical thinking. By strengthening our monastic education system, we can cultivate a generation of enlightened leaders who will guide our empire towards a prosperous and harmonious future."
  tcr_nalanda_title: "Nalanda Mahavihara"
  tcr_nalanda_desc: "The ancient university of Nalanda, once a beacon of knowledge and learning, now lies in ruins. Situated in the heart of our empire, it was once a center for Buddhist scholarship, attracting students and scholars from across the world. We must invest in the restoration and revitalization of Nalanda, transforming it back into a thriving institution of higher learning. By doing so, we can ensure that our empire remains at the forefront of intellectual and spiritual development, fostering a culture of knowledge and enlightenment for generations to come."
  tcr_syncretism_title: "Religious Syncretism"
  tcr_syncretism_desc: "Our empire is a melting pot of diverse cultures and religions. To ensure the stability and harmony of our society, we must promote religious syncretism, encouraging the blending and coexistence of different faiths. This includes fostering dialogue and understanding between various religious communities, as well as promoting shared rituals and practices that celebrate our common values. By embracing religious syncretism, we can create a unified and harmonious society that thrives on diversity and mutual respect."
  tcr_great_trunk_road_title: "The Great Trunk Road"
  tcr_great_trunk_road_desc: "The Great Trunk Road is a vital artery of trade and commerce, stretching across the length of our empire. By investing in the development and maintenance of this crucial infrastructure, we can enhance the flow of goods, people, and ideas throughout our vast territory. This includes improving road conditions, establishing rest stops and trade hubs, and ensuring the safety of travelers along the route. By strengthening the Great Trunk Road, we can bolster our empire's economic prosperity and foster greater unity among our diverse regions."
  tcr_burma_title: "Conquer Burma"
  tcr_burma_desc: "Our Empire now stretches far beyond that of the Kushan Empire of yore. From the Indus to the Irrawaddy, our influence is felt across the lands of India and into Southeast Asia. Yet, there is still more to be done. The Kingdom of Pagan in Burma remains a proud and independent realm, resisting our overtures for alliance and trade. We must bring them into our fold, either through diplomacy or conquest, to ensure that our empire's reach extends even further into this rich and diverse region."
  tcr_malacca_title: "Viceroyalty of Malacca"
  tcr_malacca_desc: "The Malacca Strait is one of the most important maritime trade routes in the world, connecting the Indian Ocean to the South China Sea and beyond. By establishing a viceroyalty in Malacca, we can secure our control over this vital chokepoint, ensuring that our empire remains a dominant force in regional trade and commerce. This will also provide us with a strategic foothold in Southeast Asia, allowing us to expand our influence and project our power further into the region."
  tcr_siam_title: "The Siam Campaign"
  tcr_siam_desc: "Land of Siam, rich in resources and strategic value, lies to the east of our empire. The Kingdom of Ayutthaya has long been a rival for influence in the region, and it is time for us to assert our dominance. We must launch a campaign to conquer Siam, bringing its peoples under our rule and integrating them into our empire."
  tcr_tibet_india_title: "Rule Tibet"
  tcr_tibet_india_desc: "Tibet is a land of great spiritual significance and strategic importance, and one with a long history connected to our homeland in the Tarim Basin. By bringing Tibet under our control, we can secure our northern borders, access valuable resources, and establish a strong presence in the region. This will also allow us to influence the religious and cultural landscape of Tibet, fostering greater unity and cooperation between our empire and its diverse subjects."
  tcr_center_of_world_title: "Center of the World"
  tcr_center_of_world_desc: "With our empire firmly established across the Indian subcontinent and into Southeast Asia, we have become a true center of the world. We must leverage our unique position to transform our humble empire into a true economic and bureaucratic powerhouse."
  tcr_mass_education_title: "Mass Education"
  tcr_mass_education_desc: "To ensure the continued prosperity and stability of our empire, we must invest in the education of our people. By establishing a system of mass education, we can provide our citizens with the knowledge and skills they need to contribute to the growth and development of our society. This includes building schools, training teachers, and developing a curriculum that emphasizes critical thinking, civic responsibility, and practical skills. By empowering our people through education, we can create a more informed and engaged citizenry, capable of driving our empire forward into a bright and prosperous future."
  tcr_industrial_ambition_title: "Industrial Ambitions"
  tcr_industrial_ambition_desc: "Across the world, nations are embracing the power of industry to drive economic growth and development. To ensure that our empire remains competitive in this new era, we must pursue our own industrial ambitions. This includes investing in the development of factories, infrastructure, and technology that will enable us to produce goods on a large scale. By embracing industrialization, we can create jobs, boost our economy, and position our empire as a leading force in the global marketplace. We will make the transition from the age of serfdom and agrarian economy to that of industry and mechanization!"
  tcr_state_religion_policy_title: "Matters of Religion"
  tcr_state_religion_policy_desc: "Religion plays a crucial role in shaping the identity and values of our empire. We are left with the question of how to to tailor our religious policies to best suit the needs of our diverse population and growing empire. Do we pursue a path of religious tolerance, allowing for the coexistence of multiple faiths within our realm? Or do we seek to establish a dominant state religion that unifies our people under a single spiritual banner? Whatever path we choose, it is essential that we carefully consider the implications of our religious policies on the stability and prosperity of our empire."
  tcr_tyrant_title: "Rule of the Tyrant"
  tcr_tyrant_desc: "All in our empire must bow to the will of the Tyrant. This ancient title harkens back to the powerful rulers of the Kushan Empire, who wielded absolute authority over their subjects. As the Tyrant, we must ensure that our rule is unchallenged and that our authority is respected throughout the realm. By embracing the mantle of the Tyrant, we can solidify our power and ensure the continued stability and prosperity of our empire."
  tcr_fate_kush_title: "Kushan Rebirth"
  tcr_fate_kush_desc: "While we have claimed the mantle of our Kushan ancestors, we have yet to fully realize the potential of our empire, until today. With the greatest cities formerly controlled by this mighty empire now under our control, from Bactria to Pataliputra, we have the opportunity to restore the Kushan Empire to its former glory, and by extension legitimize our claim as the rightful rulers of Hindustan. The Kushan Empire rises from the ashes!"
  tcr_new_coinage_title: "New Coinage"
  tcr_new_coinage_desc: "One of the lasting legacies of the Kushan Empire was its distinctive coinage, which featured a blend of Greek, Indian, and Central Asian influences. To honor this legacy and strengthen our own empire's economic identity, we must introduce a new coinage system that reflects our unique cultural heritage. This includes designing coins that incorporate elements from our diverse traditions, as well as establishing a standardized currency that facilitates trade and commerce throughout our realm. By adopting a new coinage system, we can enhance our empire's economic stability and promote a sense of unity among our diverse subjects."
  tcr_selective_borrowing_title: "Selective Borrowing"
  tcr_selective_borrowing_desc: "Our empire is a melting pot of diverse cultures and traditions. To ensure the continued growth and development of our society, we must embrace the practice of selective borrowing, drawing upon the best ideas and practices from various cultures while maintaining our own unique identity. This includes adopting innovations in governance, technology, and culture that can enhance our empire's prosperity and stability. By practicing selective borrowing, we can create a dynamic and adaptable society that thrives on diversity and innovation."
  tcr_right_conquest_title: "Right of Conquest"
  tcr_right_conquest_desc: "Just as our ancestors, just as Kanishka and Alexander the Great themselves had before, assert the right of conquest over the lands we have claimed. We must continue to expand our empire, asserting our authority over new territories and peoples. This includes establishing a clear legal framework for the acquisition of land, as well as ensuring that our military forces are prepared to defend our claims against any challengers. By embracing the right of conquest, we can secure our empire's future and ensure that our legacy endures for generations to come."
  tcr_aryan_spirit_title: "The Aryan Spirit"
  tcr_aryan_spirit_desc: "The Aryan spirit, characterized by courage, honor, and a commitment to excellence, has long been a defining feature of our empire. We must continue to cultivate and promote these values among our people, fostering a sense of pride and unity that will inspire them to achieve greatness in all aspects of life. This includes encouraging the pursuit of knowledge, artistic expression, and military prowess, as well as promoting a culture of civic responsibility and ethical conduct. By embracing the Aryan spirit, we can ensure that our empire remains a beacon of strength, wisdom, and virtue for generations to come."
  tcr_indian_humanities_title: "Indian Humanism"
  tcr_indian_humanities_desc: "The rich philosophical traditions of India have long emphasized the importance of humanism, compassion, and ethical conduct. By embracing these principles, we can foster a society that values the well-being and dignity of all its citizens. This includes promoting social justice, equality, and the protection of human rights, as well as encouraging the pursuit of knowledge, artistic expression, and cultural exchange. By integrating Indian humanism into our governance and societal values, we can create a more just, compassionate, and enlightened empire that serves as a model for the world."
  tcr_taxila_model_title: "The Taxila Model"
  tcr_taxila_model_desc: "The ancient city of Taxila was once a thriving center of learning, culture, and commerce, attracting scholars, traders, and artisans from across the region. By studying the Taxila Model, we can draw upon its rich history and traditions to inform our own approach to governance, education, and economic development. This includes investing in the restoration and revitalization of Taxila, promoting cultural exchange, and fostering a spirit of intellectual curiosity and innovation. By embracing the Taxila Model, we can create a vibrant and prosperous society that honors our past while preparing for the challenges and opportunities of the future."
  tcr_enlightened_adminstration_title: "Enlightened Administration"
  tcr_enlightened_adminstration_desc: "Our Empire finds itself home to the foremost centers of learning in the world, and we must ensure that our administration is equipped to harness this wealth of knowledge. By implementing an enlightened approach to governance, we can foster a culture of innovation, critical thinking, and evidence-based decision-making. This includes investing in education, research, and the development of skilled administrators who can effectively manage the complexities of our diverse empire. By embracing enlightened administration, we can ensure that our empire remains at the forefront of intellectual and cultural advancement."
  tcr_enlightened_adminstration_india_title: "Enlightened Administration"
  tcr_enlightened_adminstration_india_desc: "Our Empire finds itself home to the foremost centers of learning in the world, and we must ensure that our administration is equipped to harness this wealth of knowledge. By implementing an enlightened approach to governance, we can foster a culture of innovation, critical thinking, and evidence-based decision-making. This includes investing in education, research, and the development of skilled administrators who can effectively manage the complexities of our diverse empire. By embracing enlightened administration, we can ensure that our empire remains at the forefront of intellectual and cultural advancement."
  tcr_splendor_capital_title: "Jewel of the Empire"
  tcr_splendor_capital_desc: "Our capital city, a shining jewel of the empire, stands as a testament to our power, wealth, and cultural achievements. We must continue to invest in the development and beautification of our capital, ensuring that it remains a vibrant center of commerce, culture, and innovation. This includes improving infrastructure, promoting the arts, and fostering a sense of civic pride among our citizens. By enhancing the splendor of our capital, we can project our empire's strength and prestige to the world, attracting talent, investment, and admiration from across the globe."
  tcr_mysore_rockets_title: "The Mysore Rockets"
  tcr_mysore_rockets_desc: "In South India, our Vassal in the Mysore region has developed a new kind of artillery, known as the Mysore rockets. These rockets are made of bamboo and iron, and are capable of causing massive damage to enemy formations. Light and portable, being able to be fire from both horseback and foot soldiers, it would be unwise to ignore this technology as we continue our expansion into India."
  tcr_elephant_warfare_title: "Elephant Warfare"
  tcr_elephant_warfare_desc: "War elephants have long been a staple of Indian warfare, used to break enemy lines and instill fear in opposing forces. These majestic creatures, when properly trained and equipped, can serve as powerful assets on the battlefield. We must invest in the training and maintenance of our war elephants, ensuring that they are ready to serve in our military campaigns. By embracing elephant warfare, we can enhance our military capabilities and project our power across the Indian subcontinent."
  tcr_rajput_regiments_title: "The Rajput Registry"
  tcr_rajput_regiments_desc: "The Rajput clans, known for their valor and martial traditions, have long been a formidable force in the Indian subcontinent. In order to ensure their loyatly, many in our adminstration have suggested we create a registry to formalize their service to our empire. By doing so, we can better integrate these fierce warriors into our military structure, while also providing them with recognition and rewards for their contributions. This registry will serve as a testament to our commitment to honoring the traditions and valor of the Rajput clans."
  tcr_jai_hind_title: "Jai Hind!"
  tcr_jai_hind_desc: "Across the Empire, our military forces have adopted the rallying cry of 'Jai Hind!', meaning 'Victory to India!'. This powerful slogan embodies the spirit of unity and patriotism that drives our soldiers to fight for the glory of our empire. We must continue to promote this rallying cry among our troops, fostering a sense of pride and camaraderie that will inspire them to achieve great victories on the battlefield."
  tcr_conscription_title: "Modern Conscription"
  tcr_conscription_desc: "While we have typically relied on levies and volunteers from the tribes during times of war, modern war has changed the very concepts of prepardness and readiness. No longer can we wait and hope that our nobles mobilze in time to face our enemies, we must start to construct a system of conscription, preparing a new standing army for the challenges that are yet to come."
  tcr_afghan_silk_title: "Afghan Silk"
  tcr_afghan_silk_desc: "While our economic power is increasing by the day, much of Afghanistan remains poor and produces only meager goods. Our next step in Afghan development should be to improve this situation in our outer provinces and sponsor large scale production enterprises in order to spur economic growth in these lands."
  tcr_afghan_silk_per_title: "Afghan Silk"
  tcr_afghan_silk_per_desc: "While our economic power is increasing by the day, much of Afghanistan remains poor and produces only meager goods. Our next step in Afghan development should be to improve this situation in our outer provinces and sponsor large scale production enterprises in order to spur economic growth in these lands."
  tcr_chola_title: "Chola Legacy"
  tcr_chola_desc: "The Chola dynasty was one of the greatest families to ever rule over India, and they expanded their empire far beyond the subcontinent. We should replicate their conquests, and gain a foothold in Southeast Asia."
  tcr_xinan_india_title: "Enter Xinan"
  tcr_xinan_india_desc: "Xinan, a region rich in resources and strategic value, lies to the east of our empire. By expanding our influence into Xinan, we can secure vital trade routes, access valuable resources, and create a bridgehead deeper into Chinese territory. While Hindustan may be rich land in of itself, China is a land of great wealth and opportunity, and we must seize it before other powers do."
  tcr_monastic_guilds_title: "Monastic Guilds"
  tcr_monastic_guilds_desc: "Our new type of guild is emerging throughout our lands, combining piety and labor into a sort of indomniable holy fusion of effort. They are Monastic Guilds, combining the asectic lifestyle of monks and those who live in monasteries with the high quality of craftsmanship of artisans, leading to a life dedicated on producing goods or services. We should funnel money from the clergy into these guilds, providing an ample boost to our economy."
  tcr_bactrian_script_title: "Codify Bactrian Script"
  tcr_bactrian_script_desc: "Bactrian has been the lingua franca of Afghanistan for some time, but now myriad languages and dialects occupy the sectors of adminstration and commerce. In order to streamline the functions of the state, and begun to form a national identity, codifying the Bactrian Script is crucial. We should work quickly to make it standard in the bureacracy, education, and other facets of the state."
  tcr_melting_pot_title: "The Melting Pot"
  tcr_melting_pot_desc: "The Kushan Empire, from its various ancestors, migrants, trade connections, and so on and so fourth, is truly the most cosmopolitan nation in the world. Hundreds of different laungauges are spoken throughout the empire, luxury goods flow to all ends, and even a peasant can make a decent living for himself through the security and stability of the markets ensured by our strong army and even stronger finanical system. We have done nothing but embrace our differences, for just like the Kushan Empire of yore, they only make us stronger!"
  tcr_military_doctrine_title: "Military Doctrine"
  tcr_military_doctrine_desc: "Warfare is changing, gone are the days of pikes and swords. Today warfare is fought with guns and cannons that blast your enemies away. We need to follow these new tactics to get ahead of our neighbours." 
  #----------------------#

  #----Persian/Bactrian Missions----#
  tcr_topchis_title: "Tofangchi and Tupchi"
  tcr_topchis_desc: "Topchi are the modern and westernized forces that lie at the corp of our army, acting as an example of the discpline, expertise, and training needed for our future campaigns and martial competiviness required for our continual survival. We should expand these regiments, and make sure we have an elite and well-equipped force at the center of our armed forces."
  tcr_merv_title: "Secure Merv"
  tcr_merv_desc: "Merv is one of the grandest fortresses in the whole world, which unfortunately stands in our way. The terrain is inhospitable, the walls are high, but if we do not deal with the threat right away or else the fortress could grow more impenetrable."
  tcr_merv_per_title: "Secure Merv"
  tcr_merv_per_desc: "Merv is one of the grandest fortresses in the whole world, which unfortunately stands in our way. The terrain is inhospitable, the walls are high, but if we do not deal with the threat right away or else the fortress could grow more impenetrable."
  tcr_guard_per_title: "The Western Trade Route"
  tcr_guard_per_desc: "The trade routes that stretch from Baghdad to Beijing are dominated by various tribes and hordes that raise their taxes and tariffs on the goods that flow on the silk road. They grow fat from this trade, filling their coffers and palaces with riches beyond belief. Should we remove them, we can take the trade for our own, dominating the silk road once more."
  tcr_khotan_title: "Restore Khotan"
  tcr_khotan_desc: "The once sprawling and industrious city of Khotan was once the seat of a humble yet economically powerful kingdom taking after its name sake. It used to be a key center in the production of silk, as well as a major stop over between China and the West along the Silk Road. Restoring this city to its rightful status as a finanical and economic hub in the region will help to cement our authority over the flow of silk in the region and our grip over this vital trade route." 
  tcr_rebuild_parsa_title: "Rebuild Parsa"
  tcr_rebuild_parsa_desc: "The ancient city of Parsa, once the heart of the mighty Achaemenid Empire, lies in ruins. Its grand palaces and temples have been reduced to rubble, a testament to the passage of time and the ravages of war. We must invest in the restoration and revitalization of Parsa, transforming it back into a thriving center of culture and commerce. By doing so, we can honor our rich heritage and ensure that Parsa once again becomes a symbol of our empire's strength and resilience."
  tcr_rebuild_cradle_title: "Revitalize the Cradle"
  tcr_rebuild_cradle_desc: "Mesopotamia, the Cradle of Civilization, was once the centerpoint and most developed region in the entire world, spawning new forms of literature, governance, art, science, and much more. But centuries of war, environmental disaster, and many other conundrums have left this land in a sorry state. By directly investing in the region and promoting its proud heritage, we can return the Cradle to its rightful place as a center of innovation and sociological evolution."
  tcr_bactria_title: "Kushans and Greeks"
  tcr_bactria_desc: "The Kushan Empire was, at one point, an empire that aided ours in our hour of need against the Han Dynasty. In the modern day, the land of the Kushan lays bare of their history, with few remnants of their might and power. We will honor their legacy and bring their territory into the fold, as a thank you to our ally long gone. We will also do well to honor the Bactrians, our Greek ancestors who bestowed upon us sacred knowledge and an indominable spirit, who too influenced the Kushans. We will bear this legacy openly and defiantly in the face of all those who oppose us."
  tcr_khorasan_frontier_title: "Khorasani Incursion"
  tcr_khorasan_frontier_desc: "The rich lands of Khorasan were also once part of the Seleucid Empire, and Kushan control extended over these lands at one point as well. By crushing the squabbling houses of Khorasan under our boot, we will have a strategically important crossroads under our control, allowing us to expand deeper into Persia."
  tcr_khorasan_per_title: "Bactrian Homeland"
  tcr_khorasan_per_desc: "Afghanistan, once known as a Bactria, was home the Indo-Hellenistic Greco-Bactrian Kingdoms, and was the heartland of the once mighty Kushan Empire. In order to cement our claims to the West and establish a bridgehead further into our former territories, this 'Graveyard' of Empires must be brought under the heel, and its hidden wealth and luxuries brought under our control once more."
  tcr_gulf_monopoly_title: "Monopoly over the Gulf"
  tcr_gulf_monopoly_desc: "With our authority over the Gulf and its vital trading ports that link the East to the West, it is only nature that the we have inherited the monopoly over the region's luxury goods that were once under the control of the Khaleeji merchants. Until the Westerners discover a new route to India, or even if they have by the time we have affirmed our rule in this area, they will be more than willing to pay for the convienence and ease of transport provided by the routes and markets accessible through our dominion."
  tcr_devastate_georgia_title: "Devastate Georgia"
  tcr_devastate_georgia_desc: "Georgia has been a point of contention for our ancestors. Over the long centuries, Georgia, Armenia and the mountains of the Caucasus have been a place of struggle, where Roman, Persian and mercenary blood alike have been shed, drying in the old and wizened mountain valleys. Now, no vast, treacherous empire waits to challenge us - the region is ours for the picking, ours to dominate, ours to claim."
  tcr_illkhannate_title: "Execute the Ilkhan"
  tcr_illkhannate_desc: "Fallen and dilapidated as they are, the steppe fiends persist in their malice, exercising cruelty over the valleys of the Caucasus. They seek to bide their time - waiting for a new moment to raze, plunder and oppress. This cannot come to pass. Every last Mongol warlord must be brought to heel - so that Mongol rule, in the mind of every peasant, far and near, may become but a distant memory."
  tcr_maragheh_title: "The Maragheh Observatory"
  tcr_maragheh_desc: "Centuries ago, an observatory was constructed by the Ilkhanids just shy of the city of Maragheh. To their credit, many notable astronomers and scientists flocked to the site, pioneering strange new inventions and astronomical observations. Sadly, lack of patronage and neglect have reduced the observatory to a depleted husk. To celebrate our reclamation and restoration of Persia, we should restore the observatory!"
  tcr_secure_coast_title: "Secure the Coast"
  tcr_secure_coast_desc: "The Persian Gulf is a den of trade. Merchants from far and wide traverse its rocky coastlines to ferry the whimsical riches of India to the proud zealots of the Levant. As a result, it has rich maritime foundations, as well as well-worn, critical defensive positions and valuable ports. Securing the southern coastline will grant us naval supremacy over our regional rivals."
  tcr_fortify_title: "Fortify the Frontier"
  tcr_fortify_desc: "Georgia now under our control we must defend our Northern borders from any would be invaders. The Caucasus mountains provide a natural barrier, but we must also invest in fortifications and garrisons to ensure that our hold on the region remains unchallenged. By fortifying our frontier, we can protect our empire from external threats and ensure the stability and security of our realm."
  tcr_levant_advance_title: "Advance into the Levant"
  tcr_levant_advance_desc: "Before the Muslims, before the Christians, before Alexander, the Levant was a wing of our empire. Persian influence stretched from Gaza to Ghor - simpler, better times, which were robbed from us by heathens, barbarians and treacherous ravagers. With the Levant tantalisingly close, our generals, our armies, yearn to reclaim what was once ours - and just one triumph could empower our military's morale to blazing heights unseen."
  tcr_hellenic_levant_title: "Legacy of the Hellenic Levant"
  tcr_hellenic_levant_desc: "Prior to the Islamic Conquests and the various other invasions suffered by the region, the Levant used to be home to many Hellenistic cities and key centers of trade, ones that could be easily restored to their former glory and surprass the bustling metropolises built by the Caliphates. It is time we reconstruct these once vital settlements, and forge a new chapter in the history of the Levant."
  tcr_fertile_crescent_title: "The Fertile Crescent"
  tcr_fertile_crescent_desc: "To our west, crowding the Tigris and the Euphrates, sits a world abused, in tatters and bereft of autonomy - a world where civilisation once blossomed and stood tall. At our height, we cradled the Fertile Crescent, bestowed upon it the respect it deserved. Now, we must do so again - drive out the barbarians which dare despoil it!"
  tcr_gerrha_mazun_title: "Claim Gerrha and Mazun"
  tcr_gerrha_mazun_desc: "To the south of Meshan is Gerrha - a vital Arabian coastline, rife with fierce commercial competition. For centuries, the Khaleeji of Arabia have competed valiantly with our native merchants - but no more, we say. With our resurgent strength, we may conquer and assimilate this region, making it a vital addition to our blossoming trade empire. While Mazun is the heartland of the Khaleeji, the Hormuzi merchants our empire tirelessly competes against, sits at our feet. Helpless and petty, they may fall to our efforts - and with the tip of Arabia in our grasp, a monopoly, a domination outright of the Indian Ocean, could be within our grasp, securing our place in the world as a naval hegemon to be feared."
  tcr_ctesiphon_title: "Rebuild Ctesiphon"
  tcr_ctesiphon_desc: "For hundreds of years, Ctesiphon stood as a ceremonious capital of Persia. Known as a place where several cities crowded, met and eventually merged, Ctesiphon was a vital geopolitical crossroad and some say one of the largest cities in the world. After the Muslim conquest however, the city fell into disarray. With vengeance on the menu, our advisors suggest we make from its ruins a city far greater, far more magnificent, far more wealthy than any seen before - a new Ctesiphon, a shining Ctesiphon!"
  tcr_nahrawan_title: "The Nahrawan Canal"
  tcr_nahrawan_desc: "During the times of Parthia, great works were undertaken along the Tigris and Euphrates to ensure water flowed where it was needed. Mesopotamia was fed by its convoluted, sprawling system of veins - farmers and peasants alike depending on the flow of its waters for sustenance and prosperity. Barbaric infighting and countless wars have seen the canals abused and razed however. Now that we are back in charge, it is our divine duty to see these great works restored and Mesopotamia prosper."
  tcr_markets_shapurshur_title: "Markets of Shapurshahr"
  tcr_markets_shapurshur_desc: "Iran and the surrounding areas are home to many centres of trade like Shiraz, Basra, Baghdad and Shapurshahr. In order to facilitate this we need to build grand bazaars and storage houses to accommodate traders, merchants and their wares."
  tcr_jerusalem_title: "Capture Jerusalem"
  tcr_jerusalem_desc: "Jerusalem, the holy city revered by all Abramhamic faiths, lies at the heart of the Levant. Its strategic location and religious significance make it a coveted prize for any empire seeking to establish dominance in the region. By capturing Jerusalem, we can assert our authority over the Levant, while also gaining control of a city that holds immense cultural and spiritual value. We must launch a campaign to capture Jerusalem. Either becoming its custodian, or its destroyer...."
  tcr_egypt_title: "Reclaim Agiptus"
  tcr_egypt_desc: "Egypt was a jewel of our empire. It is an ancient granary, a heartland of North Africa, the western extent of old Persia. Robbed from us over a thousand years ago by the wily Alexander and his rabble of Macedonian curs, Egypt has since been torn apart - going from Greek, to Roman, to Arabic hands in the blink of an eye. We have no doubt that the Arabic Egyptians, unfamiliar as they are to the Persian ways, would gladly welcome our stability and tolerance."
  tcr_turkey_title: "Anatolian Dominance"
  tcr_turkey_desc: "Anatolia, the land bridge between East and West, has long been Persian by right of conquest. The Seljuks, Romans, Greeks, and its many other occupiers have all vied for control of this strategic region, but none have held it for long. Now, with our empire resurgent, we must assert our dominance over Anatolia, bringing its diverse peoples under our rule and integrating them into our empire."
  tcr_persianize_the_turks_title: "Persianize the Turks"
  tcr_persianize_the_turks_desc: "Anatolia is ours and with it, a sizable population of Turks. Their tenacity and wealth of manpower cannot be denied - they would make a fine addition to the empire, should they be educated and civilised. If we were to rid them of the various accumulated traditions and tongues clinging to them, we could assimilate the Turks beneath our cultural banner - make them Iranians, well and true, for centuries to come."
  tcr_persopolis_title: "Reclaim Persepolis"
  tcr_persopolis_desc: "The province of Parsa, home to the ancient and beautiful ceremonial capital of Persepolis, must be reclaimed to truly assert our claim as the heir to the Greco-Persian legacy. With this crucial seat of power and its symbolic role as the seat of divine authority, no one will be able to refute our claims as the true Shahs of Persia."
  tcr_turkic_legacy_title: "Turkic Legacy"
  tcr_turkic_legacy_desc: "While we have attempted to distant ourselves from the influence of Turkic society, it is an unignorable part of our identity. Their great conquerers have inspired generations of military thinkers, and their vast and largely autonomous style of governance and meritocracy influences our political instituitons. The ideas of their trade guilds and infrastructure czars are reflected in our economic and city planning policies. It is time we synthesis the impact of Turkic occupation and colonization with that of the rest of the diverse melting pot that is our history."
  tcr_buglaria_title: "Push onto Bulgaria"
  tcr_buglaria_desc: "While Bulgaria remained a largely uncivilized land during the Greek and Iranian imperial eras, it is a key bridgehead further into Europe and its status the foremost regional power in the area threatens our interests as we continue to push the legitimate claims we have inherited from our forefathers. The Bulgarian Empire must be destroyed."
  tcr_macedonian_title: "Mantle of Macedon"
  tcr_macedonian_desc: "We have achieved the dreams of great ancestor Alexander the Great, and with the actualization of his imperial ambition, we have come to inherit the title of the mightest of empires to exist in the Hellenistic Period: Macedon. The spirit of this vast and fearsome empire resonates throughout martial, intellectual, and bureacratic culture, with the mythos of our nation now being deeply entrenched in our Greco-Bactrian roots. The mantle of Macedon is simply the next step in embodying this legacy."
  tcr_greece_title: "Take Greece"
  tcr_greece_desc: "Across the glimmering waters of the Bosporus sits a city eternal - the city of Constantinople, founded and pioneered by its namesake simply to situate the Roman power structure closer to our borders, to keep us at bay. Countless hundreds of thousands, perhaps millions of our ancestors, bled in the once-endless struggle against Roman tyranny. To capture Constantinople, to subjugate Thrace, to advance upon the wretched coastlines of Greece, would be to restore our honour and avenge our ancestors."
  tcr_arabia_title: "Subjugate The Arabs"
  tcr_arabia_desc: "The Arabian Peninsula, home to the proud and resilient Arab tribes, has long been a region of strategic importance. Its vast deserts and rugged terrain have made it a challenging area to conquer, but its control is essential for securing our empire's southern borders."
  tcr_constantinople_title: "Avenge Nineveh"
  tcr_constantinople_desc: "A thousand years have passed since a humiliation so brutal that it stains our history. The bastard Roman Heraclius shattered our armies at the ancient Assyrian site of Nineveh, sending the Sassanian realm into such catastrophic disarray that the Muslims dared attempt to brutalise our people and way of life in a struggle that lasted centuries. Now, we have returned - Nineveh and the Bosporus alike are ours. Constantinople, one of the beating hearts of Roman identity, awaits. Let us have our revenge."
  tcr_terminus_title: "Terminus of the Silk Road"
  tcr_terminus_desc: "Egypt is in our grasp and our empire greets the Mediterranean with open arms, welcoming its riches and eager merchants as if they were old friends. This has not come without issue, however - greedy Europeans have leapt at the chance to exploit the turmoil, slipping into a kind of economic power vacuum to garner as much wealth as possible. We must have none of it - Aleppo and Alexandria bow to US, it is OUR coin which reigns here! Only through Persia can the lifeblood of the Silk Road be ferried!"
  tcr_kushan_renaissance_title: "Kushan Renaissance"
  tcr_kushan_renaissance_desc: "The ancient Kushan Empire was a beacon of culture, trade, and innovation. To honor this legacy and revitalize our own empire, we must embark on a Kushan Renaissance. This involves promoting the arts, sciences, and cultural exchange that once flourished under Kushan rule. By embracing this renaissance, we can foster a vibrant and dynamic society that celebrates our rich heritage while also looking towards the future."
  tcr_splendid_court_title: "Splendid Court"
  tcr_splendid_court_desc: "What sort of monarch would [Root.Monarch.GetName] be, if [Root.Monarch.GetSheHe] did not surround [Root.Monarch.GetHerselfHimselfCap] with the finest advisors money can hire?"
  tcr_educate_masses_title: "Educate the Masses"
  tcr_educate_masses_desc: "There is no honour in ruling over a mass of peasants and ignorant degenerates, and our enlightened state can afford to pay for buildings fit to raise every Persian into a potential great priest, diplomat or general."
  tcr_persian_heritage_title: "Persian Heritage"
  tcr_persian_heritage_desc: "The Perisan Empires and the subsquent Greco-Iranian dynasties have irrevocably shaped the nature of society, economy, government, but most of all the present state of empire today and the future that lies ahead of it. We should pay our respects to their legacy, and restore the lands of Persia to their former glory."
  tcr_gondeshapur_title: "Academy of Gondeshapur"
  tcr_gondeshapur_desc: "The Academy of Gondeshapur, once a renowned center of learning and scholarship, has fallen into disrepair. To honor its legacy and promote intellectual growth within our empire, we must invest in the restoration and revitalization of this historic institution. By doing so, we can create a hub of knowledge and innovation that will attract scholars and students from across the region, fostering a culture of learning and enlightenment, sparking another scientific revolution in the field of medicine."
  tcr_mountain_expansion_title: "Mountain Expansion"
  tcr_mountain_expansion_desc: "The Persian highlands have been undervalued by every dimwit warlord who tried pacifying them - not wasteland, nay, but the jumping point for the greatest cities in the world, closest to Heaven and sprawling across it. It is about time we show our dull neighbours how it's done."
  tcr_terminus_of_world_title: "Terminus of the World"
  tcr_terminus_of_world_desc: "With our empire stretching from Bactria to Egypt, we have become a true terminus of the world. We must leverage our unique position to transform our empire into a global hub of trade, culture, and innovation. This includes investing in infrastructure, promoting cultural exchange, and fostering economic development that will attract merchants, scholars, and artists from across the globe. By embracing our role as the terminus of the world, we can ensure that our empire remains a dominant force in the global landscape for generations to come."
  tcr_seat_of_shah_title: "Seat of the Shah"
  tcr_seat_of_shah_desc: "Our capital city must reflect the grandeur and authority of the Shah. By investing in the development and beautification of our capital, we can create a city that serves as a fitting seat of power for our empire. This includes constructing grand palaces, government buildings, and public spaces that showcase our empire's wealth and sophistication."
  tcr_cataphracts_title: "Modernize The Cataphracts"
  tcr_cataphracts_desc: "The Cataphracts - mounted warriors and hoofed beasts plated all over in the finest metal armour - were a staple of old Persia. Cataphracts struck fear in the hearts of our rivals of old, shattering Roman legions and rebel rabble alike with impunity. So successful were they that the remnant Romans of later ages adopted our tactics, seeking to copy us - admittedly, to great effect. Let us revive this monster of the battlefield!"
  tcr_turkmen_mercs_title: "Turkmen Mercenaries"
  tcr_turkmen_mercs_desc: "The Turkmen, known for their fierce independence and martial prowess, have long been sought after as mercenaries by various empires and kingdoms. Their skills in horseback riding and archery make them formidable warriors on the battlefield. We must establish strong ties with the Turkmen tribes, recruiting their warriors into our military forces to bolster our strength."
  tcr_combined_arms_title: "Combined Arms Doctrine"
  tcr_combined_arms_desc: "The art of war is ever-evolving, and to maintain our military superiority, we must embrace the principles of combined arms warfare. This doctrine emphasizes the integration of different military branches - infantry, cavalry, artillery, and support units - to create a cohesive and adaptable fighting force. By coordinating the strengths of each branch, we can exploit enemy weaknesses and achieve decisive victories on the battlefield. We must invest in training and doctrine development to ensure that our forces are proficient in combined arms tactics, allowing us to respond effectively to any threat."
  tcr_immortals_title: "The Immortals"
  tcr_immortals_desc: "Our proud history has been muddied and diluted over time. Legends stand out however - paramount among them, that of the Immortals. Recalled by ancient Persian and Roman scholars alike, the Immortals were fierce heavy infantry of great standing, numbering 10,000 at any given time, no more, no less. In service, they guarded not only our ruler, but the empire as a whole. With our military might and burgeoning empire, it seems right that we revive this legend and make our enemies cower!"
  tcr_persianate_empire_title: "Persianate Empire"
  tcr_persianate_empire_desc: "With our shift toward the West, we have revived the ancient traditions of the Persian Empire. By adopting the administrative practices and cultural norms of the Persians, we aim to create a more efficient and unified state that can better manage our diverse populations and territories. This change is expected to strengthen our overall state capacity, foster greater unity and stability within our realm, and allow us to better navigate the complexities of ruling a vast and culturally rich empire."
  tcr_divine_authority_title: "Divine Authority"
  tcr_divine_authority_desc: "The Monarch's rule has been ordianed by the heavens, and the gods look down upon him with great joy, knowing his future to be bright. No one may challenge or question or rule under such circumstances, for it would be nothing more than blasphemy."
  tcr_flame_of_persia_title: "Flame Of Persia"
  tcr_flame_of_persia_desc: "Under our watchful gaze, we have brought light to Persia once again, acting as the holy flame found in its many fire temples, we purified the land of all that is wrong, restoring peace and justice to a once broken land. We will continue to burn bright for centuries to come!"
  tcr_greco_iranian_spirit_title: "Greco-Iranian Spirit"
  tcr_greco_iranian_spirit_desc: "Our Bactrian heritage was founded upon the mixture of Hellenistic and Iranian civilizations. Fusing together their cultural trappings and norms, along with their shared martial tradition, the spirit of both these empires runs through our veins, and has guided the minds of our generals, drive of our bureaucrats, and fervor of our preachers in our efforts to forge a new empire that will stand the test of time. This Greco-Iranian Spirit has turned into a sort of national identity for our people, one they proudly wear throughout their day to day happenings, and call upon for strength in the hardest of moments."
  #----------------------#

  #----Chinese/Yuezhi Missions----#
  tcr_rebuild_qaraorum_title: "Restore Qaraqorum"
  tcr_rebuild_qaraorum_desc: "Qaraqorum, great capital of Temujin Borjigin Chinggis Khagan, the ancestor of the dreaded Hordes, is a shadow of its former self. Despite our despise for the Steppe riders, it would provide a strong base of power in the region. We will restore the grandeur of the first Great Khan's city."
  tcr_naadam_title: "Naadam Festival"
  tcr_naadam_desc: "The Naadam festival is the decannual festival of the mongol people in which young men participate in wrestling, archery, and horsemanship. It not only brings our people together, but also encourages young men to practice the military arts."
  tcr_manchuria_title: "Tame Manchuria"
  tcr_manchuria_desc: "The vast and untamed lands of Manchuria lie to our northeast, a region rich in resources and potential. However, its rugged terrain and fierce indigenous tribes have made it a challenging area to control. To secure our empire's borders and harness the wealth of Manchuria, we must embark on a campaign to tame the region. This includes establishing military outposts, promoting settlement and development, and fostering alliances with local tribes. By bringing Manchuria under our control, we can ensure the stability and prosperity of our empire."
  tcr_raise_manchu_banners_title: "Raise the Banners"
  tcr_raise_manchu_banners_desc: "With Manchuria under our control, many former tribal adversaries have raised their banners in allegiance to us. Integrating these fierce and mighty warriors into our empire could be crucail to achieving victory over the perfidious Mongols and other steppe nomads that oppress China."
  tcr_yanjing_title: "Restoration of Yanjing"
  tcr_yanjing_desc: "Beijing, Nanjing, and so fourth, the Forbidden City stands tall as a symbol of authority and celestial providence to all those that call China their home. It has been known by many names, seeing many different iterations of layout, structure, and architectural apperance over the years. But with the arrival of the Yuezhi to Northern China, and our control over the city cemeneted, we harken back to its glourious past as Yanjing, and seek to emulate its splendor as we relocate our court and other adminstrative functionaries to this new center of power."
  tcr_mongol_yam_title: "Sino-Mongol Yam"
  tcr_mongol_yam_desc: "A yam is a system of supply points established accross a large region to create ease of travel, commerce, and information spread. By establishing these routes accross China, we can make our vast empire seem much smaller and more navigable."
  tcr_mongol_tactics_title: "Adopt Mongol Tactics"
  tcr_mongol_tactics_desc: "The Mongols, masters of steppe warfare, have long been a formidable adversary on the battlefield. Their innovative tactics, including rapid mobility, feigned retreats, and coordinated attacks, have allowed them to conquer vast territories and defeat larger, more established armies. To enhance our own military capabilities, we must study and adopt these Mongol tactics, integrating them into our existing military doctrine. By doing so, we can improve our army's flexibility, responsiveness, and effectiveness in combat."
  tcr_china_north_title: "Mop up the North"
  tcr_china_north_desc: "With the North relatively secured, we must route the Yuan forces and the encoraching Warlods of the South. For now the gates to the South are almost open, and we must take advanatge of the ensuing chaos to bring all of China under our control."
  tcr_korea_integrate_title: "Sinification of Korea"
  tcr_korea_integrate_desc: "The Korean people, with their rich cultural heritage and strong national identity, have long maintained a distinct identity from their Chinese neighbors. However, to ensure the stability and unity of our empire, we must work to integrate Korea more closely into our cultural and political framework. This includes promoting the adoption of Chinese customs, language, and governance structures among the Korean population."
  tcr_yangtze_title: "Cross the Yangtze"
  tcr_yangtze_desc: "Just as Caesar crossed the Rubicon, so too must we cross the Yangtze. The river is a natural barrier, one that has protected southern China from northern invaders for centuries. However, with our military might and strategic planning, we can overcome this obstacle and bring the entirety of China under our control."
  tcr_sinification_title: "Sinification of Tocharia"
  tcr_sinification_desc: "While historically we have been influenced by many cultures, it is time for Tocharia to fully embrace the rich traditions and customs of China. By promoting the adoption of Chinese language, governance, and cultural practices, we can strengthen our ties to this great civilization and ensure our rule for centuries to come!"
  tcr_chinese_coast_title: "Secure the Chinese Coast"
  tcr_chinese_coast_desc: "The eastern coastline of China is a vital hub of trade and commerce, connecting our empire to the wider world. By securing control over this region, we can ensure the flow of goods and wealth into our empire, while also protecting our maritime interests from rival powers. This will require a combination of military strength, diplomatic efforts, and economic investment to establish our dominance along the Chinese coast."
  tcr_xinan_title: "Control Xinan"
  tcr_xinan_desc: "The southwestern region of China, known as Xinan, is a land of great cultural diversity and economic potential. By establishing control over this region, we can tap into its rich resources and unique cultural heritage."
  tcr_tea_title: "Tea Monopoly"
  tcr_tea_desc: "Tea is one of the most valuable commodities in the world, and China is its primary producer. By establishing a monopoly over the tea trade, we can control the flow of this precious commodity and reap significant economic benefits for our empire."
  tcr_taiwan_title: "Colonize Taiwan"
  tcr_taiwan_desc: "The island of Taiwan, located off the southeastern coast of China, is a land of great potential and opportunity. By colonizing Taiwan, we can establish a strategic foothold in the region, acting as a springboard for further expansion and influence."
  tcr_china_reunite_title: "Reunite China"
  tcr_china_reunite_desc: "China, once a unified and powerful empire, has been fragmented and divided for centuries. With the final deathblow dealt to the Southern Warlords, we have secured our control over the entire Chinese heartland. It is time to proclaim a new Chinese Empire, one that unites all under our banner and restores the glory of this great civilization."
  tcr_sec_title: "Foreign Concessions"
  tcr_sec_desc: "As we come into increased contact with the West and other new age colonial powers, we must adapt our economy to take advantage of new trade opportunities. By establishing Special Economic Zones in key coastal cities, we can attract foreign investment, promote export-oriented industries, and foster economic growth. These zones will serve as hubs of innovation and commerce, driving our empire's prosperity in the modern era while insulating us from the challenges of globalization and colonial ambition."
  tcr_western_shield_title: "Shield of the Taklamakan"
  tcr_western_shield_desc: "The Taklamakan is a vital passageway to the West, being a key route for Silk Road traders for centruies. Now with Tibet and much of China under our rule, we control the centers of production for the luxuries that travel this route. We must reinforce and bolster our centers of trade and infrastructure in the region, securing our land connection to the West and the great wealth of this exchange."
  tcr_ordu_title: "Integrate the Ordu"
  tcr_ordu_desc: "The Ordu are the elite bodyguards and retainers of the Liao and the rump successor state of Qara Khitai that were once our former oppressors. Now that we have conquered this once fearsome menace of the Steppes, we have noticed parts of their society that would be in our best interest to synthesis with our own. The Ordu will became an elite force in our army, on par with the mighty banners of the Manchurian people."
  tcr_kor_science_title: "Korean Sciences"
  tcr_kor_science_desc: "The Korean people have always had an innovative and industrious spirit, creating expansive and rigorious academic institutions, libraries, and much more. We should invest in this way of life, promoting learning and knowledge above all else, turning the Korean people into the intellectual powerhouse of the East."
  tcr_indo_china_campaign_title: "Indochina Campaign"
  tcr_indo_china_campaign_desc: "The Indochina region, with its rich resources and strategic location, is a key area for our expansion. By launching a campaign to assert our influence over this territory, we can secure vital trade routes, access valuable resources, and establish a strong foothold in Southeast Asia."
  tcr_malay_title: "Control Malay"
  tcr_malay_desc: "The Malay Peninsula is a vital trade route, responsible for the flow of wealth from the East to West. It is in our best interest to control this region, ensuring that we can benefit from the riches that pass through it and denying the scheming Westerners access to these resources."
  tcr_siberia_title: "Into Siberia"
  tcr_siberia_desc: "Far to the North, beyond the Steppes of Mongolia and the highlands of Manchuria, lie the vast and unexplored expanse of Siberia. Nations to the West have rushed to colonize this region, rapidly expanding toward our domain. We must focus on our own colonization of this region, and control their access to the Pacific."
  tcr_china_burma_title: "Conquer Burma"
  tcr_china_burma_desc: "Burma, with its rich cultural heritage and abundant natural resources, is a key region for our empire's expansion. By conquering Burma, we can secure our southern borders, access valuable resources, and establish a strong presence in South Asia."
  tcr_japan_title: "Subjugate Japan"
  tcr_japan_desc: "The island nation of Japan, with its mighty Samurai and strong martial traditions has always been a rival to our Empire. With the yoke of the Mongols thrown off, Japan's status as a rising power in Asia is a direct threat to our rule. We must act quickly, and strike the Rising Sun down before it can consume us."
  tcr_sinojapanese_title: "Legend of Fusau"
  tcr_sino_japanese_desc: "The land of the Rising Sun, known in Chinese legend as Fusau, has completely fallen under our control, and with that, their long and intertwined history of the Sino-Japanese cultural exchange has come to a head. New dialects of formed, the people have converted to our faith or harmonized with our Confucian ideals. Japanese and Chinese intellectual worlds have fused into one mighty conglomerate of shared thought. The birth of a new culture, one that supercedes the divides between the Chinese and Japanese people, that of the Fusau."
  tcr_new_world_title: "The New World"
  tcr_new_world_desc: "The discovery of the New World has opened up a wealth of opportunities for our empire. By establishing colonies and trade routes in this vast and untapped land, we can access valuable resources, expand our influence, and secure our position as a global power."
  tcr_confucian_education_title: "Confucian Education"
  tcr_confucian_education_desc: "Confucianism, with its emphasis on morality, social harmony, and respect for authority, has long been a cornerstone of Chinese culture and governance. To ensure the stability and prosperity of our empire, we must promote Confucian education among our populace. By establishing schools and institutions that teach Confucian principles, we can cultivate a well-educated and virtuous citizenry that upholds the values of our empire."
  tcr_inward_perfection_title: "Inward Perfection"
  tcr_inward_perfection_desc: "We have had our time of expansion. We have expanded past the boundaries of the old empires. Now is the time for us to settle down and focus on domestic affairs. We must focus on the achievement of inward perfection. For if we are not perfect inwardly, then we can not respond to foreign threats cohesively."
  tcr_four_great_schools_title: "Four Great Schools"
  tcr_four_great_schools_desc: "The Four Great schools shall be integrated into our administration for the benefit of our governance and the continuation of confucian bureaucratic traditon."
  tcr_yuelu_title: "Yuelu Academy"
  tcr_yuelu_desc: "The Yuelu Academy is the oldest preserved center of high level eduation in China, being established during the Song dynasty in the 10th century. Its prestige has attracted many scholars to come to both preserve and share knowledge. We should modernize this academy to let it better fulfill this purpose."
  tcr_censorate_title: "Reform the Censorate"
  tcr_censorate_desc: "The Censorate has been one of the most important information agency of the empire since its establishment during the Qin dynasty. It is considered as the 'eyes and ears' of the Emperor. We must reform and modernize this agency to maximize our efforts to root our dissidency."
  tcr_coordinators_title: "Grand Coordinators"
  tcr_coordinators_desc: "The eastern equivalent of a viceroy, commonly known within our country as Xunfu is a key office that plays an important role within our administration. We must tend to promoting able coordinators and ensure their loyalty to the Emperor."
  tcr_canals_rivers_title: "Tame the China's Sorrow"
  tcr_canals_rivers_desc: "Rivers are the lifeblood of our civilization as they provide our people with valuable land and the basic necessities. However, various floods that may take place every few decades are a threat of the highest authority not only towards our subjects' livelihoods but also to our stable rule."
  tcr_grand_canal_title: "The Grand Canal"
  tcr_grand_canal_desc: "The Grand Canal connects the Yellow River in the north to the Yangtze River in the south, a massive feat of engineering unparalleled in the world. These connections significantly improve ease of trade within China and have brought great prosperity to many cities along its route."
  tcr_urbanization_title: "Encourage Urbanization"
  tcr_urbanization_desc: "We should encourage urbanization to major urban centers to further accelerate the growth of metropolises and to provide more workers for the industries, which are mostly located in urban centers."
  tcr_luxuries_title: "Monopoly on Luxury Goods"
  tcr_luxuries_desc: "China is a land known for many luxury goods such as silk and porcelain. Not only are they well beloved by the Chinese people, the recently arrived Europeans also showed interests in these items. Therefore it is in our best inerest to achieve and maintain a monopoly on these luxury goods to ensure our trade standing against both domestic competitors and European intruders."
  tcr_economic_heart_title: "Economic Heart of China"
  tcr_economic_heart_desc: "In the past, the farmer and tax collector held up the economy of the nation. No longer. Now, the great cities of central China are bustling centers of commerce and production that form the economic heart of our nation. By bolstering these already established cities, we can ensure continuous prosperity."
  tcr_steel_title: "Expand the Steel Industry"
  tcr_steel_desc: "The steel industry is a vital component of our empire's economic growth and industrialization. By expanding and modernizing our steel production capabilities, we can meet the increasing demand for this essential material in various sectors, including construction, manufacturing, and transportation. This includes investing in new technologies, infrastructure, and skilled labor to ensure efficient and high-quality steel production. By strengthening our steel industry, we can support our empire's ambitions for growth and prosperity."
  tcr_workshop_of_world_title: "Workshop of the World"
  tcr_workshop_of_world_desc: "We have industrialised a lot and it significantly changed our society for the better. We are now the number one producer in many fields and other nations now call us the workshop of the world. We should embrace this reputation with pride."
  tcr_form_imperial_army_title: "Form The Imperial Army"
  tcr_form_imperial_army_desc: "With our industrial might growing, it is time we form a modern imperial army to protect our interests both at home and abroad. This army will be equipped with the latest technology and trained in modern tactics to ensure our dominance on the battlefield."
  tcr_xandu_gun_title: "The Xanadu Gun"
  tcr_xandu_gun_desc: "The Xanadu Gun is the oldest form of gun that the Chinese have invented. It is a beautiful, powerful but heavy tool. We ought to employ shocktroops in our army that will be fielded with Xanadu guns. Their production shall be streamlined and made less heavy to make them more practical to give us an edge over our foes."
  tcr_foreign_officiers_title: "Foreign Officers"
  tcr_foreign_officiers_desc: "With the arrival of Europeans in our shores, we have the opportunity to learn from their advanced military techniques and technologies. By recruiting foreign officers with expertise in these areas, we can enhance our own military capabilities and gain a competitive edge on the battlefield."
  tcr_military_schools_title: "New Military Schools"
  tcr_military_schools_desc: "To ensure that our military remains at the forefront of innovation and effectiveness, we must establish new military schools that focus on advanced training and education for our officers and soldiers. These schools will provide comprehensive instruction in modern tactics, strategy, and technology, equipping our forces with the knowledge and skills necessary to excel in contemporary warfare."
  tcr_enlist_the_tribes_title: "Enlist The Tribes"
  tcr_enlist_the_tribes_desc: "The Tribes of Manchuria and Mongolia have fell before us, but not without putting up stiff resistance. Instead of fighting them, and attempting to force our ways upon them, we should offer them privileges and rights within their rights in exchange for military service, providing us with a strong retinue of horse archers and cavalry."
  tcr_yuezhi_crisis_title: "The Yuezhi Crisis"
  tcr_yuezhi_crisis_desc: "A new crisis is brewing for the Emperor of China, one of our own creation. The Yuezhi people who once ruled Gansu are now making their return, aand this time no one will stop us. Thousands of infiltrators from the tribes under our banner have already begun to probe the border, and the Emperor will have no choice but to face us widly unprepared. Today we return home!"
  tcr_muduken_palace_title: "Mukden Palace"
  tcr_muduken_palace_desc: "Mukden Palace is the supreme symbol of authority amongst the Manchu Tribesmen. By crowning ourselves as Emperor of Manchuria in this structure, we can ensure that their banners will rally to our cause."
  tcr_raise_banners_title: "Codify the Banners"
  tcr_raise_banners_desc: "Manchurian Banners have proven to be some of our most effective military forces, yet they operate on a semi-volunteer noble levy basis. Instead of relying on the nobles to gather these effective forces, we should institutionalize their role in the military, and ensure that we always have an elite retinue of soldiers ready to face the challenges that lie ahead."
  tcr_china_innovation_title: "History of Innovation"
  tcr_china_innovation_desc: "Many of the World's greatest technological, philosophoical, and scientific advancements have come from the minds of Chinese scholars. As we have maintained and expanded the lands vast network of academic institutions and continued to cultivate an environment of intellectual competition, we continue to be the foremost innovator on the globe. The spirit of Chinese innovation cannot be stopped."
  tcr_sino_yuezhi_spirit_title: "Sino-Yuezhi Spirit"
  tcr_sino_yuezhi_spirit_desc: "The spirit of our Yuezhi ancestors has effectively and effortlessly merged with the ideas and principles of Chinese society, fusing into a new national and cultural identity unlike anything seen before. The martial prowess and mixed heritage of the Yuezhi people has resulted in open-mindedness and martial prowess amongst our people, while the practices and traditions of the Chinese have cultivated a nation of skilled scholars and bureacrats."
  tcr_eight_banners_title: "The Eight Banners"
  tcr_eight_banners_desc: "The Manchu and Chinese have organized their armed forces into 'Banners', elite army groups integral to the success of their expansive military campaigns to unify and expand the Chinese sphere of influence. We must model our own army off these elite banners, ensuring our successs in future campaigns to forge a great Celestial Empire."
  tcr_yuezhi_cavalry_title: "Yuezhi Cavalry Legacy"
  tcr_yuezhi_cavalry_desc: "The semi-nomadic history of the Yuezhi people and their links to Steppe civilization has cemented horsmenship and martial horseback skill as irreplacable facets of our society. We must continue to nuture these traditions, creating a strong and unmatchable cavalry force."
  tcr_mass_doctrine_title: "Mass Doctrine"
  tcr_mass_doctrine_desc: "The gigantic population we now preside over can be used to our advanatge in many ways, but both our foreign advisors and own military thinkers have formulated a new mass force approach when it comes to warfare. Wave upon of wave of soldiers, from elite to irregular, will be thrown upon our enemies, creating an unstoppable tsunami of flesh and steel that no force, whether we are outmatched or outgunned, can overcome..."
  tcr_xinan_colonize_title: "Fate of Xinan"
  tcr_xinan_colonize_desc: "Now that we have asserted our control over the region of Xinan, we are faced with a difficult decision. It is inhabitated by peoples who are deeply stepped in a mixed Sino-Tibetan culture, yet vast waves of Chinese settlers seeking a new life or escape from our rule are rapidly settling the region, causing a divide between the two groups. We must settle on the fate of this region, which will ultimately shape our control over the Western border for centuries to come."
