  ### Kushan/India Events [[[
  abf_tcr_india_event.1.t: "Pax Kushana"
  abf_tcr_india_event.1.d: "We have finally achieved what our ancestors sought to so long ago. From the hills of Bactria to the sun-kissed coasts of Southern India, our banners fly supreme. The great Kushan Empire has been restored, and with it, we take Hindush and along with the rest of empire into a new era: Pax Kushana."
  abf_tcr_india_event.1.a: "Let us adopt an §YImperial§! Title!"
  abf_tcr_india_event.1.b: "Drop the formalities and let a new age dawn!"
  abf_tcr_india_event.2.t: "The Great Temple of Mathura"
  abf_tcr_india_event.2.d: "In the days of yore, the mighty Kushan Empire erected many great monuments and temples as a testament to their faith. Regardless of the path we've chosen, we must honor this legacy and claim spiritual superiority over the realm through the construction of a new great work. A temple where followers of the true faith will flock from all over the world to gaze upon its glory. Today, we begin the construction of the Great Temple of Mathura!"
  abf_tcr_india_event.2.a: "Let construction begin!"
  abf_tcr_india_event.2.b: "Let construction begin!"
  abf_tcr_india_event.2.c: "Let construction begin!"
  ### ]]]

  ### Yuezhi/China Events [[[
  abf_tcr_china_event.1.t: "Fall of Khanbaliq"
  abf_tcr_china_event.1.d: "After a turbulent siege, Khanbaliq has finally succumbed to our strength of arms; its garrison's morale is destroyed, the gates reduced to kindling, and the empire's pride dragged through the mud. While the emperor and his sycophantic entourage may have fled, Yuan's treasury is largely intact, leaving us with a great abundance of plunder for the troops to divide as spoils of war. Alas, chaos is rampant in the streets, with panicking citizens - and even the imperial guard - engaging in widespread looting across affluent districts, while non-combatants desperately scramble to escape, or hurl themselves from the walls. It is abundantly clear now that the empire of Kublai Khan is in its death throes. From the ashes, we may rebuild China in our image!"
  abf_tcr_china_event.1.a: "The Mongol menace has been vanquished!"
  abf_tcr_china_event.2.t: "A New Era of the Dynastic Cycle"
  abf_tcr_china_event.2.d: "With the fall of the Yuan dynasty and other Northern claimants, we are positioned to mark a permanent imprint on Chinese history: a new dynasty in the Middle Kingdom's dynastic cycle. Our unique blend of Tocharian and Chinese cultures has created a vibrant and prosperous society that is unlike anything seen before. We have embraced the best aspects of both cultures, creating a new dynasty that is strong, prosperous, and united. Our people are proud of their heritage, and we are confident that our new dynasty will stand the test of time."
  abf_tcr_china_event.2.a: "Kowtow before the §Ymem Yuezhi§!!"
  abf_tcr_china_event.3.t: "Reunification of the Celestial Empire"
  abf_tcr_china_event.3.d: "For many years, China has been divided along the Huai River between the rebel princedoms of the south and the ailing Yuan in the north. Taking advanatge of their temporary weakness and instability, Yuezhi banners fly from Khanbaliq to Nanjing to Guangzhou, achieving the dream of our forebearers. All of China lies under our control for the first time in decades, and our monarch has proclaimed their primacy as the sole Emperor of China. Now, we shall rule with a wise hand, following the great emperors who came before us."
  abf_tcr_china_event.3.a: "Let a new age dawn!"
  abf_tcr_china_event.4.t: "Landfall in Japan"
  abf_tcr_china_event.4.d: "We have done what the Mongols had failed to do for many centuries: We have made landfall in Japan. Sailing through the treacherous Korean seas, we have delievered a deathblow to the Mongol Toyouji puppet shogun and sent ripples northward throughout the upstart daiymos. The rest of Japan lies unprotected and unprepared for our newest campaign, and will soon submit to our authority."
  abf_tcr_china_event.4.a: "Dusk approaches for the Land of the Rising Sun"
  abf_tcr_china_event.5.t: "The Tiger Wakes"
  abf_tcr_china_event.5.d: "We have done a great deal of work in the reorganization and reformulation of our military. A vast network of logistical infrastructure supports our campaigns across East Asia, a new system of conscription bolsters our growing ranks, and innovative new military technologies provide us a crucial edge over our enemies. With all we have done, through integration or importation of ideas and equipment, our foremost martial thinkers have begun crafting a new military doctrine, one focused on using our enormous population and supply network to overwhelm our enemies no matter their technological advancement or mastery of warfare. While the general outline and structure of this doctrine has been complete, the [Root.Monarch.GetTitle] has been presented with two choices. One is to dedicate ourselves to the idea of quantity, throwing wave after wave of soldier upon the enemy regardless of casuality count before they submit to our unending onslaught. The other is one that incorporates principles of discpline and quality, preserving a large standard army, but honing their skills and cultivating their fervor through constant martial drills. The time has come to decide the nature of our armed forces..."
  abf_tcr_china_event.5.a: "A tsunami of flesh and steel will wash over enemies!"
  abf_tcr_china_event.5.b: "A large and highly trained force will subdue our foes!"
  ### ]]]
 
  ### Persia/Bactria [[[
  abf_tcr_persia_event.1.t: "City of the World's Desire"
  abf_tcr_persia_event.1.d: "While we have done well to apperciate aspects of our Greek heritage, nothing erases the stain on the history of the Persian that was Alexande the Great's conquest of our lands. But now we have asserted ourselves as the true heirs of both the Persian and Greek worlds. With the capture of Constantinople, we have taken the city that has been the jewel of both empires for centuries. Now, we shall rebuild it in our image, creating a city that is worthy of being called the capital of the world."
  abf_tcr_persia_event.1.a: "Forward to Glory!"
  abf_tcr_persia_event.2.t: "Fate of Masjid al-Haram"
  abf_tcr_persia_event.2.d: "With our conquest of the Arabian Peninsula complete, we have come to a crossroads regarding the fate of Masjid al-Haram, the holiest site in Islam. Some in our court suggest that we should preserve the mosque and allow it to continue to serve as a place of worship for Muslims around the world. Others believe that we should repurpose the site, transforming it into a glorious cathedral to commemorateour victory and as a symbol of our power. This is a difficult decision, but we must choose wisely. The fate of Masjid al-Haram will have far-reaching implications for our relations with the Muslim world and our own legitimacy as rulers."
  abf_tcr_persia_event.2.a: "Convert the Mosque into a Church!"
  abf_tcr_persia_event.2.b: "Preserve the site and tax the Pilgrims!"
  ### ]]]

