################################## Ruler Personalities ##################################

###----- Ruler Personalities------####
             ### Gather TT's whenver possible check for overlap with existing ####

###---Polish (all Faiths)---####
ABF_LEGACY_OF_MIESZKO_PERK_TT: "Every future ruler will gain the §YDescendant of Mieszko§! Ruler Personality, granting §G-10.0%§! Core Creation Cost, §G+5.0§! Yearly Papal Influence, and §G+2§! Max Accepted Cultures."
abf_mieszko_descendant_personality: "Descendant of Mieszko" #PLN, POL, PLC/Catholic Poland
abf_mieszko_descendant_personality_desc: "Our bloodline traces back to Mieszko I, the first ruler of Poland. His legacy of uniting diverse tribes and establishing a strong foundation for our nation inspires us to continue his work. We are determined to uphold the values of unity, resilience, and cultural pride that Mieszko championed. As his descendant, we feel a profound responsibility to lead our people with the same vision and dedication that defined his reign."
abf_heir_of_rus_personality: "Heir of Rus'" #LUD/LCT/Orthodox Poland
abf_heir_of_rus_personality_desc: "We are the heirs of the great Rus' legacy, carrying forward the traditions and values of our ancestors. Our lineage is steeped in the rich history of the Kievan Rus', and we are committed to preserving and enhancing this heritage. As rulers, we strive to embody the strength, wisdom, and cultural depth that defined our forebears. We are dedicated to fostering unity among our people and promoting the prosperity of our nation, honoring the legacy of Rus' in all our endeavors."
ABF_HEIRS_OF_RUS_PERK_TT: "Every future ruler will gain the trait §YHeir of Rus'§!, giving §G-5.0%§! Core Creation Cost, §G+5.0§! Yearly Patriarch Authority, and §G-10.0%§! Warscore Cost vs Other Religions."
#--------------------------------------------------------------------------------------------------------------------#

###---Livonia + Formables---####
abf_lva_vanquisher_of_slavs: "Vanquisher Of The Slavs"
abf_lva_vanquisher_of_slavs_desc: "We have done what many thought impossible: conquer the East. We fought the wiley Cossacks of the Wild Fields, the wealthy merchants of Novgorod, the Patriarch of Kiev, and the bickering princes of the interior. We have proven ourselves to be the true rulers of Krievzeme, and no one can take our new birthright away from us. For just as we vanquished the Slavs, so too shall we vanquish all those who challenge our rule."
ABF_LVA_RULER_TRAIT_TT: "Every future ruler will gain the trait §YVanquisher of the Slavs§!, giving §G+10.0%§! Governing Capacity Modifier and §G+15.0%§! Manpower in Primary Culture Group Provinces"
#--------------------------------------------------------------------------------------------------------------------#

###---Tatar/Euro-GLH---####
abf_glh_batu_khan_legacy: "Spirit of Batu Khan"
abf_glh_batu_khan_legacy_desc: "Urus and its people are finally ours, just as the great Batu Khan had dreamed of when he was sent to conquer the lands of the West. The Urus, with the rights and privileged granted to them, as well as through our shared ways of life, have come to accept us with open arms, and honor the legacy of the Khans that once ruled over them. Now we invoke his name on the battlefield, emulating his martial prowess in our campaigns."
ABF_GLH_BATU_LEGACY_PERSONALITY_TT: "Every future ruler will gain the trait §YSpirit of Batu Khan§!, giving §G+0.10§! Military Tactics, §G+10.0%§! Morale Damage, and §G+10.0%§! Governing Capacity."
#--------------------------------------------------------------------------------------------------------------------#

###---Slav/Euro-GLH---####
abf_glh_intitution_yaroslav: "Intitution of Yaroslav"
abf_glh_intitution_yaroslav_desc: "The Ruthenian people, just as they have time and time again, endured and survived the impossible. We have overcome the Tatar's attempts to subjugate and assimilate us, and instead infiltrated them from within and transformed their state. Using the knowledge of state craft, cultural patronage, and martial sovereignty passed down to us from the great Yaroslav the Wise, our future has been secured, and Rus find itself under the authority of its true heirs."
ABF_GLH_YAROSLAV_LEGACY_PERSONALITY_TT: "Every future ruler will gain the trait §YIntitution of Yaroslav the Wise§!, giving §G-5.0%§! Technology Cost, §G+5.0%§! Morale of Armies, and §G+5.0%§! Adminstrative Efficiency."
#--------------------------------------------------------------------------------------------------------------------#

